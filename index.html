function eucKrDecode(bytes){
  let out = '';
  for (let i = 0; i < bytes.length; i++){
    const b = bytes[i];
    if (b < 0x80){ out += String.fromCharCode(b); continue; }
    if (i + 1 < bytes.length && b >= 0xB0 && b <= 0xC8 && bytes[i + 1] >= 0xA1 && bytes[i + 1] <= 0xFE){
      out += EUCKR_HANGUL.charAt((b - 0xB0) * 94 + (bytes[i + 1] - 0xA1)) || '?';
      i++;
      continue;
    }
    if (i + 1 < bytes.length && bytes[i + 1] >= 0xA1 && bytes[i + 1] <= 0xFE){ out += '?'; i++; }
    else out += '?';
  }
  return out;
}
function qpDecode(str, charset){
  const src = String(str == null ? '' : str).replace(/=(?:\r?\n)/g, '');
  const bytes = [];
  for (let i = 0; i < src.length; i++){
    const ch = src.charAt(i);
    if (ch === '=' && /^[0-9A-Fa-f]{2}$/.test(src.substr(i + 1, 2))){
      bytes.push(parseInt(src.substr(i + 1, 2), 16));
      i += 2;
      continue;
    }
    const code = src.charCodeAt(i);
    if (code < 0x80){
      if (code !== 13 && code !== 10) bytes.push(code);
      continue;
    }
    let cp = code;
    if (code >= 0xD800 && code <= 0xDBFF && i + 1 < src.length){
      const lo = src.charCodeAt(i + 1);
      if (lo >= 0xDC00 && lo <= 0xDFFF){ cp = 0x10000 + ((code - 0xD800) << 10) + (lo - 0xDC00); i++; }
    }
    pushUtf8Bytes(bytes, cp);
  }
  return bytesToText(new Uint8Array(bytes), charset);
}

function decodeQpText(s, charset){
  let cur = String(s == null ? '' : s);
  for (let i = 0; i < 4 && looksQuotedPrintable(cur); i++){
    const dec = qpDecode(cur, charset);
    if (!dec || dec === cur) break;
    cur = dec;
  }
  return cur;
}

/* ---------- 줄 접기(\r?\n[ \t]) · QP 소프트 줄바꿈(=\r?\n) 병합 ---------- */
function vcardUnfold(src){
  const rawLines = String(src == null ? '' : src).replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
  const out = [];
  rawLines.forEach(raw => {
    if (/^[ \t]/.test(raw) && out.length){
      const prev = out[out.length - 1];
      out[out.length - 1] = (/=$/.test(prev) ? prev.slice(0, -1) : prev) + raw.slice(1);
      return;
    }
    const line = raw.replace(/\s+$/, '');
    if (!line) return;
    if (out.length && /=$/.test(out[out.length - 1]) && !/^BEGIN:VCARD/i.test(line)){
      const prev = out[out.length - 1];
      const qpish = /QUOTED-PRINTABLE|=[0-9A-Fa-f]{2}/i.test(prev) || /[^\x00-\x7F]/.test(prev);
      if (qpish){ out[out.length - 1] = prev.slice(0, -1) + line; return; }
    }
    out.push(line);
  });
  return out;
}
function vcardSplitEscaped(s, sep){
  const str = String(s == null ? '' : s);
  const out = [];
  let cur = '';
  for (let i = 0; i < str.length; i++){
    const ch = str.charAt(i);
    if (ch === '\\' && i + 1 < str.length){ cur += ch + str.charAt(i + 1); i++; continue; }
    if (ch === sep){ out.push(cur); cur = ''; continue; }
    cur += ch;
  }
  out.push(cur);
  return out;
}
function vcardCharset(head){
  const m = String(head || '').match(/CHARSET\s*=\s*"?([A-Za-z0-9_.:\-]+)"?/i);
  return m ? m[1] : '';
}

/* vCard(.vcf) — 2.1(QUOTED-PRINTABLE) · 3.0 · 4.0 */
function parseVCardText(text){
  const out = [];
  let cur = null;
  const flush = () => {
    if (!cur) return;
    const tels = cur.tel.slice().sort((a, b) => b.cell - a.cell);
    const phones = [];
    tels.forEach(t => { const n = normPhone(t.value); if (n && phones.indexOf(n) < 0) phones.push(n); });

    const nParts = vcardSplitEscaped(cur.n || '', ';').map(vcardText);
    const nLast = nParts[0] || '', nFirst = nParts[1] || '';
    const nRest = nParts.slice(2).filter(Boolean);

    let name = vcardText(cur.fn || '');
    if (!name && (nLast || nFirst)){
      name = /[\uAC00-\uD7A3]/.test(nLast + nFirst) ? (nLast + nFirst) : [nFirst, nLast].filter(Boolean).join(' ');
    }
    if (!name && nRest.length) name = nRest[0];
    const org = vcardSplitEscaped(cur.org || '', ';').filter(Boolean).map(vcardText).join(' ');
    if (!name) name = org;
    const adr = vcardSplitEscaped(cur.adr || '', ';').filter(Boolean).map(vcardText).join(' ');
    const memo = [vcardText(cur.note || ''), adr].filter(Boolean).join(' · ');
    if (name || phones.length){
      out.push({ name: name.trim(), phone: phones.length ? formatPhone(phones[0]) : '',
        phones: phones, org: org, memo: memo, source: 'VCF' });
    }
    cur = null;
  };

  for (const line of vcardUnfold(text)){
    if (/^BEGIN:VCARD/i.test(line)){ flush(); cur = { tel: [] }; continue; }
    if (/^END:VCARD/i.test(line)){ flush(); continue; }
    if (!cur) continue;
    const ci = line.indexOf(':');
    if (ci < 0) continue;
    const head = line.slice(0, ci);
    const headUp = head.toUpperCase();
    const bare = head.split(';')[0] || '';
    const key = String(bare.split('.').pop() || '').toUpperCase();
    const isQp = /QUOTED-PRINTABLE|ENCODING\s*=\s*QP(?:$|[;:])/i.test(head);
    const charset = vcardCharset(head);
    let value = line.slice(ci + 1);
    if (isQp || /=[0-9A-Fa-f]{2}/.test(value)) value = qpDecode(value, charset);
    value = value.replace(/\r?\n/g, ' ').replace(/\s+$/, '');
    const isCell = /CELL|MOBILE|IPHONE|HANDHELD/i.test(headUp);
    if (key === 'FN') cur.fn = value;
    else if (key === 'N') cur.n = value;
    else if (key === 'TEL') cur.tel.push({ value: value, cell: isCell ? 1 : 0 });
    else if (key === 'ORG') cur.org = value;
    else if (key === 'NOTE') cur.note = value;
    else if (key === 'ADR') cur.adr = value;
    else if (key === 'EMAIL' && !cur.email) cur.email = value;
  }
  flush();
  return out;
}

/* CSV / TXT 공통 */
function csvRows(text, delim){
  const rows = [];
  let row = [], cell = '', q = false;
  const s = String(text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  for (let i = 0; i < s.length; i++){
    const ch = s[i];
    if (q){
      if (ch === '"'){
        if (s[i + 1] === '"'){ cell += '"'; i++; }
        else q = false;
      } else cell += ch;
    } else if (ch === '"'){ q = true; }
    else if (ch === delim){ row.push(cell); cell = ''; }
    else if (ch === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}
function isNameHeader(h){
  const c = String(h || '').replace(/\s+/g, '').toLowerCase();
  return /^(이름|성명|연락처명|고객명|거래처명|업체명|상호|name|fullname|displayname|firstname|lastname|givenname|familyname|surname|fn)$/.test(c);
}
function isPhoneHeader(h){
  const c = String(h || '').replace(/[\s\-_.]/g, '').toLowerCase();
  if (isNameHeader(h)) return false;
  return /(전화|휴대폰|휴대전화|핸드폰|모바일|연락처|phone|tel|mobile|cell)/.test(c);
}
function digitsOf(v){ return String(v == null ? '' : v).replace(/[^\d]/g, ''); }

function cellsToContact(cells, map){
  const vals = cells.map(c => String(c == null ? '' : c).trim());
  let name = '', rawPhones = [], org = '', memo = '';
  if (map){
    const get = kind => {
      const col = map.name.find(x => x.kind === kind);
      return col ? (vals[col.i] || '') : '';
    };
    const full = get('full'), first = get('first'), last = get('last');
    name = full || (first && last ? (/[\uAC00-\uD7A3]/.test(first + last) ? last + first : first + ' ' + last) : (first || last));
    rawPhones = map.phone.map(i => vals[i]).filter(v => v && digitsOf(v).length >= 7);
    org = map.org.map(i => vals[i]).filter(Boolean).join(' ');
    memo = map.memo.map(i => vals[i]).filter(Boolean).join(' · ');
  } else {
    rawPhones = vals.filter(v => digitsOf(v).length >= 7);
    name = vals.find(v => v && digitsOf(v).length < 7 && !/^[@\w.+-]+@[\w.-]+$/.test(v)) || '';
    const rest = vals.filter(v => v && v !== name && rawPhones.indexOf(v) < 0);
    memo = rest.join(' · ');
  }
  const phones = [];
  rawPhones.forEach(v => { const n = normPhone(v); if (n && phones.indexOf(n) < 0) phones.push(n); });
  return {
    name: name.trim(),
    phone: phones.length ? formatPhone(phones[0]) : '',
    phones: phones, org: org.trim(), memo: memo.trim(), source: 'CSV'
  };
}

      else if (/(메모|비고|note|memo|주소|address)/.test(low)) map.memo.push(i);
    });
    if (!map.name.length && !map.phone.length) map = null;
  }
  const dataRows = hasHeader && map ? rows.slice(1) : rows;
  return dataRows.map(cells => cellsToContact(cells, map))
    .filter(c => c.name || c.phones.length);
}

function parsePlainText(text){
  const out = [];
  String(text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n').forEach(line => {
    const t = line.trim();
    if (!t) return;
    const m = t.match(/(?:\+?82[\s\-]?)?0?\d{1,2}[\s\-.]?\d{3,4}[\s\-.]?\d{4}/) || t.match(/\+?\d[\d\-.]{6,}\d/);
    if (m){
      const rest = (t.slice(0, m.index) + ' ' + t.slice(m.index + m[0].length)).replace(/[,\t;:|]+/g, ' ').replace(/\s+/g, ' ').trim();
      out.push({ name: rest, phone: formatPhone(normPhone(m[0])), phones: [normPhone(m[0])].filter(Boolean), org: '', memo: '', source: 'TXT' });
    } else if (t.length){
      out.push({ name: t, phone: '', phones: [], org: '', memo: '', source: 'TXT' });
    }
  });
  return out;
}

function parseContactFile(fileName, text){
  const name = String(fileName || '').toLowerCase();
  const src = String(text || '');
  let rows;
  if (/\.vcf$|\.vcard$/.test(name) || /BEGIN:VCARD/i.test(src)) rows = parseVCardText(src);
  else if (/\.csv$/.test(name)) rows = parseCsvText(src);
  else {
    const first = src.split('\n')[0] || '';
    rows = /[,;\t]/.test(first) ? parseCsvText(src) : parsePlainText(src);
  }
  return rows.filter(c => c && (c.name || (c.phones && c.phones.length)));
}

function contactDupMap(){
  const map = new Map();
  DB.workers.concat(DB.clients).forEach(x => {
    const p = normPhone(x.phone);
    if (p && !map.has(p)) map.set(p, x.name || '등록됨');
  });
  return map;
}

/* ============================================================
   이미 저장된 깨진 이름 복구 (=ED=99=A9=EB=B3=91 → 홍병기)
   ============================================================ */
const QP_BROKEN = /(?:=[0-9A-Fa-f]{2}){2,}/;
function fixQpText(v){
  if (typeof v !== 'string' || !QP_BROKEN.test(v)) return v;
  const dec = decodeQpText(v);
  if (!dec || dec === v || dec.indexOf('\uFFFD') >= 0 || QP_BROKEN.test(dec)) return v;
  return dec;
}
/* 저장된 인력·거래처·근무·문자 기록의 이름을 한글로 되돌린다.
   syncBack=true 이고 DB가 연결돼 있으면 고친 값을 DB에도 올린다. */
function repairQpInDB(syncBack){
  if (!DB) return 0;
  let n = 0;
  const fixObj = (obj, fields) => {
    let ch = false;
    fields.forEach(f => {
      const before = obj[f];
      const after = fixQpText(before);
      if (after !== before){ obj[f] = after; ch = true; }
    });
    if (ch) n++;
    return ch;
  };
  (DB.workers || []).forEach(w => {
    if (fixObj(w, ['name', 'memo', 'personality', 'looks', 'account']) && syncBack) syncWorker(w);
  });
  (DB.clients || []).forEach(c => {
    if (fixObj(c, ['name', 'manager', 'address', 'memo']) && syncBack) syncClientRow(c);
  });
  (DB.shifts || []).forEach(s => {
    if (fixObj(s, ['workerName', 'place']) && syncBack) syncShift(s);
  });
  (DB.messages || []).forEach(m => {
    if (!Array.isArray(m.recipients)) return;
    let ch = false;
    m.recipients = m.recipients.map(r => { const a = fixQpText(r); if (a !== r) ch = true; return a; });
    if (ch){ n++; if (syncBack) syncSms(m); }
  });
  if (n){ try { saveDB(); } catch(e){} }
  return n;
}

const CLIENT_RATE_KEY = 'wfp_client_rates';
const EXPENSE_CATS = ['식대', '유류비', '교통비', '자재비', '기타'];

function clientRates(){
  try { return JSON.parse(localStorage.getItem(CLIENT_RATE_KEY) || '{}') || {}; } catch(e){ return {}; }
}
function clientRate(id){
  if (!id || id === '__custom') return 0;
  const v = num(clientRates()[id]);
  return v > 0 ? v : 0;
}
function setClientRate(id, v){
  if (!id || id === '__custom') return;
  const m = clientRates();
  if (num(v) > 0) m[id] = Math.round(num(v));
  else delete m[id];
  try { localStorage.setItem(CLIENT_RATE_KEY, JSON.stringify(m)); } catch(e){}
}
function monthKeyOf(x){ return String((x && x.date) || '').slice(0, 7); }
/* 거래처 청구액: 청구 시급이 있으면 시간 × 청구 시급, 없으면 수당을 뺀 근무 급여.
   추가 수당은 인력 정산(인건비)·순수익의 비용 쪽에만 들어가고 거래처 청구액에는 넣지 않는다 */
function billAmount(s){
  const cr = clientRate(s.clientId);
  if (cr > 0) return Math.round(hoursOf(s) * cr);
  return basePayOf(s);
}
function ledgerMonths(){
  const set = {};
  (DB.shifts || []).forEach(s => { const k = monthKeyOf(s); if (k) set[k] = 1; });
  (DB.expenses || []).forEach(e => { const k = monthKeyOf(e); if (k) set[k] = 1; });
  return Object.keys(set).sort().reverse();
}
function ledgerPeriod(){
  if (ui.ledgerMonth === 'all') return 'all';
  if (ui.ledgerMonth && ui.ledgerMonth !== 'current') return ui.ledgerMonth;
  const cur = todayISO().slice(0, 7);
  const months = ledgerMonths();
  return months.indexOf(cur) >= 0 ? cur : (months[0] || cur);
}
const inPeriod = (x, p) => p === 'all' || monthKeyOf(x) === p;

function viewLedger(){

function openExpenseModal(id){
  const e = id ? (DB.expenses || []).find(x => x.id === id) : null;
  const cats = EXPENSE_CATS.slice();
  if (e && e.category && cats.indexOf(e.category) < 0) cats.push(e.category);
  const body =
    '<label class="f"><span>날짜</span><input type="date" id="exDate" value="' + esc(e ? e.date : todayISO()) + '"></label>' +
    '<label class="f"><span>항목</span><select id="exCat">' + cats.map(c =>
      '<option' + (e && e.category === c ? ' selected' : '') + '>' + esc(c) + '</option>').join('') + '</select></label>' +

  openModal({
    title: e ? '지출 수정' : '지출 추가',
    sub: '일일 지출을 기록하면 그 달 순수익에 반영됩니다',
    body,
    submitLabel: e ? '수정 저장' : '추가',
    onSubmit: (wrap, close) => {
      const date = $('#exDate', wrap).value;
      const amount = num($('#exAmount', wrap).value);
      if (!date){ toast('날짜를 선택해 주세요'); return; }
      if (!(amount > 0)){ toast('금액을 입력해 주세요'); return; }
      const rec = e || { id: uid(), createdAt: new Date().toISOString(), createdBy: curAdmin().id };
      if (e){ rec.updatedBy = curAdmin().id; rec.updatedAt = new Date().toISOString(); }
      rec.date = date;
      rec.category = $('#exCat', wrap).value;
      rec.amount = Math.round(amount);
      rec.memo = $('#exMemo', wrap).value.trim();
      if (!e) DB.expenses.push(rec);
      saveDB();
      syncExpense(rec);
      close();
      render();
      toast(e ? '지출을 수정했습니다' : '지출을 추가했습니다 (' + won(rec.amount) + ')');
    }
  });
}

function togglePay(id, kind){
  const s = DB.shifts.find(x => x.id === id);
  if (!s) return;
  const doneKey = kind === 'client' ? 'clientPaid' : 'workerPaid';
  const dateKey = kind === 'client' ? 'clientPaidDate' : 'workerPaidDate';
  const byKey = kind === 'client' ? 'clientPaidBy' : 'workerPaidBy';
  const label = kind === 'client' ? '거래처 입금' : '인력 입금';

  if (!s[doneKey]){
    s[doneKey] = true;
    s[dateKey] = todayISO();
    s[byKey] = curAdmin().id;
    saveDB(); syncShift(s); render();
    toast(label + ' 완료 · ' + won(s.wage) + ' (' + curAdmin().name + ')');
  } else {
    s[doneKey] = false;
    s[dateKey] = null;
    s[byKey] = null;
    saveDB(); syncShift(s); render();
    toast(label + ' 완료를 취소했습니다 (미입금)');
  }
}

   문자 발송
   ============================================================ */
function pickTargets(){
  const pool = smsPool();
  return pool.filter(x => ui.smsSel.has(x.id));
}
function renderFor(raw, target){
  const isClient = ui.smsMode === 'client';
  return raw
    .replace(/\{거래처명\}/g, isClient ? target.name : '')
    .replace(/\{이름\}/g, target.name)
    .replace(/\{시급\}/g, won(target.rate || RATE))
    .replace(/\{일당\}/g, won(target.rate || RATE))
    .replace(/\{날짜\}/g, fmtLong(todayISO()));
}
function sendSms(){
  const targets = pickTargets();
  const body = (ui.smsBody || '').trim();
  if (!targets.length){ toast('받을 대상을 선택해 주세요'); return; }
  if (!body){ toast('보낼 내용을 입력해 주세요'); return; }

  const isClient = ui.smsMode === 'client';
  const preview = renderFor(body, targets[0]);
  const more = targets.length > 1 ? '\n\n외 ' + (targets.length - 1) + '명에게 같은 내용이 발송됩니다.' : '';

  openModal({
    title: '문자 발송 확인',
    sub: (isClient ? '거래처' : '예비 인력') + ' ' + targets.length + '곳/명에게 발송',
    body:
      '<div class="msg" style="margin:0 0 10px"><div class="msg-top"><div><span class="badge ' + (isClient ? 'reg' : 'res') + '">' +
        (isClient ? '거래처' : '예비 인력') + '</span></div><span class="msg-time">' + esc(curAdmin().name) + '</span></div>' +
        '<div class="msg-body">' + esc(preview + more) + '</div>' +
        '<div class="msg-to">받는 사람: ' + esc(targets.map(t => t.name).join(', ')) + '</div></div>' +
      '<p class="form-note">프로토타입이라 실제 SMS는 나가지 않습니다. 발송 이력에만 기록됩니다.</p>',
    submitLabel: '발송',
    onSubmit: (wrap2, close2) => {
      const rec = {
        id: uid(),
        at: new Date().toISOString(),
        managerId: curAdmin().id,
        mode: ui.smsMode,
        recipients: targets.map(t => t.name),
        count: targets.length,
        content: body
      };
      DB.messages.push(rec);
      saveDB();
      syncSms(rec);
      ui.smsSel = new Set();
      ui.smsBody = '';
      close2();
      render();
      toast(targets.length + '건 문자 발송 완료 (프로토타입)');
    }
  });
}

/* ============================================================
   이벤트
   ============================================================ */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;

  switch (act){
    case 'tab': {
      const sameTab = el.dataset.tab === ui.tab;
      if (!sameTab) navPush({ tab: el.dataset.tab });
      ui.tab = el.dataset.tab;
      render(sameTab);   /* 같은 탭을 다시 누르면 맨 위로, 탭을 옮기면 새 화면 첫머리 */
      break;
    }

    case 'admin-sheet':
      openAdminSheet();
      break;

    case 'settings':
      openSettings();
      break;

    case 'add-shift':
      openShiftModal(null);
      break;

    case 'edit-shift': {
      const sh = DB.shifts.find(x => x.id === id);
      if (sh && isOpenShift(sh)) openQuickShift({ id: id });   /* 근무중인 건은 마감·거래처 창으로 */
      else openShiftModal(id);
      break;
    }

    case 'quick-shift':
      openQuickShift({ workerId: el.dataset.worker || '' });
      break;

    case 'today-edit':
      openQuickShift({ id: id });
      break;

    case 'today-toggle':
      toggleTodayShift(el.dataset.worker);
      break;

    case 'today-attend':
      toggleAttend(el.dataset.worker);
      break;

    case 'billing-sms':
      openBillingSms(el.dataset.id || el.dataset.ids);
      break;

    case 'ledger-bill':
      openBillingSms(el.dataset.ids);
      break;

    case 'ledger-pay-client': {
      const ids = String(el.dataset.ids || '').split(',').filter(Boolean);
      const me = curAdmin();
      let n = 0;
      ids.forEach(x => {
        const sh = DB.shifts.find(v => v.id === x);
        if (sh && !sh.clientPaid){ syncPay(sh, 'clientPaid', true, me); syncShift(sh); n++; }
      });
      saveDB(); render();
      toast(n + '건 거래처 입금 완료 처리');
      break;
    }

    case 'ledger-pay-worker': {
      const ids = String(el.dataset.ids || '').split(',').filter(Boolean);
      const me = curAdmin();
      let n = 0;
      ids.forEach(x => {
        const sh = DB.shifts.find(v => v.id === x);
        if (sh && !sh.workerPaid){ syncPay(sh, 'workerPaid', true, me); syncShift(sh); n++; }
      });
      saveDB(); render();
      toast(n + '건 인력 지급 완료 처리');
      break;
    }

    case 'add-expense':
      openExpenseModal(null);
      break;

    case 'edit-expense':
      openExpenseModal(id);
      break;

    case 'del-expense': {
      const ex = (DB.expenses || []).find(x => x.id === id);
      if (!ex) break;
      confirmModal('지출 삭제', ex.date + ' · ' + (ex.category || '지출') + ' · ' + won(ex.amount) + ' 기록을 지웁니다. 삭제하면 되돌릴 수 없습니다.',
        '삭제', () => {
          DB.expenses = (DB.expenses || []).filter(x => x.id !== id);
          dbDelete('expenses', id);
          saveDB(); render();
          toast('지출을 삭제했습니다');
        });
      break;
    }

    case 'save-account': {
      const acc = saveBillingAccount({
        bank: ($('[data-acc=bank]') || {}).value,
        number: ($('[data-acc=number]') || {}).value,
        holder: ($('[data-acc=holder]') || {}).value
      });
      toast(acc.number ? '입금 계좌를 저장했습니다 (' + acc.bank + ' ' + acc.number + ')' : '입금 계좌를 저장했습니다');
      break;
    }

    case 'del-shift':
      askDeleteShift(id);
      break;

    /* 근무 내역 창의 줄별 동작 — 창을 닫고 해당 동작으로 */
    case 'worker-shift-sms': {
      const sid = id;
      closeTopModal();
      setTimeout(() => openBillingSms(sid), 80);
      break;
    }
    case 'worker-shift-edit': {
      const sid = id;
      closeTopModal();
      setTimeout(() => openShiftModal(sid), 80);
      break;
    }
    case 'worker-shift-del': {
      const sid = id;
      closeTopModal();
      setTimeout(() => askDeleteShift(sid), 80);
      break;
    }
    case 'worker-shifts-tab': {
      const wid = id || 'all';
      closeTopModal();
      setTimeout(() => {
        ui.shiftWorker = wid;
        ui.shiftStatus = 'all';
        ui.tab = 'shifts';
        render();
      }, 140);
      break;
    }

    case 'toggle-client-paid': togglePay(id, 'client'); break;
    case 'toggle-worker-paid': togglePay(id, 'worker'); break;

    case 'shift-status':
      ui.shiftStatus = el.dataset.val;
      render();
      break;

    case 'worker-status':
      ui.workerStatus = el.dataset.val;
      render();
      break;

    case 'worker-age':
      ui.workerAge = el.dataset.val;
      render();
      break;

    case 'today-status':
      ui.todayStatus = el.dataset.val;
      render();
      break;

    case 'today-age':
      ui.todayAge = el.dataset.val;
      render();
      break;

    case 'add-worker':      openWorkerModal(null);
      break;

    case 'worker-shifts':
      openWorkerShifts(id || el.dataset.worker);
      break;

    case 'worker-stats':
      openWorkerStats(id || el.dataset.id);
      break;

    case 'import-contacts':
      openContactImportModal(el.dataset.kind);
      break;

    case 'edit-worker':
      openWorkerModal(id);
      break;

    case 'del-worker': {
      const w = workerById(id);
      if (!w) break;
      const n = DB.shifts.filter(s => s.workerId === id).length;
      confirmModal('인력 삭제', w.name + ' 님을 삭제합니다.' + (n ? '\n근무 기록 ' + n + '건은 그대로 남습니다.' : ''),
        '삭제', () => {
          DB.workers = DB.workers.filter(x => x.id !== id);
          DB.shifts.forEach(s => { if (s.workerId === id) s.workerName = w.name; });
          dbDelete('workers', id);
          saveDB(); render(); toast('삭제했습니다');
        });
      break;
    }

    case 'add-client':
      openClientModal(null);
      break;

    case 'edit-client':
      openClientModal(id);
      break;

    case 'del-client': {
      const c = clientById(id);
      if (!c) break;
      const n = DB.shifts.filter(s => s.clientId === id).length;
      confirmModal('거래처 삭제', c.name + ' 을(를) 삭제합니다.' + (n ? '\n근무 기록 ' + n + '건은 그대로 남습니다.' : ''),
        '삭제', () => {
          DB.clients = DB.clients.filter(x => x.id !== id);
          DB.shifts.forEach(s => { if (s.clientId === id) s.place = c.name; });
          dbDelete('clients', id);
          saveDB(); render(); toast('삭제했습니다');
        });
      break;
    }

    case 'sms-mode':
      ui.smsMode = el.dataset.mode;
      ui.smsSel = new Set();
      ui.smsQuery = '';
      render();
      break;

    case 'sms-go':
      ui.tab = 'sms';
      ui.smsMode = el.dataset.mode;
      ui.smsSel = new Set();
      ui.smsQuery = '';
      render();
      break;

    case 'sms-one': {
      ui.tab = 'sms';
      ui.smsMode = 'client';
      ui.smsQuery = '';
      ui.smsSel = new Set([id]);
      render();
      break;
    }

    case 'tpl': {
      const list = TEMPLATES[ui.smsMode === 'client' ? 'client' : 'worker'];
      const t = list[Number(el.dataset.i)];
      if (!t) break;
      const ta = $('#smsBody');
      if (ta){
        ta.value = t.text;
        ui.smsBody = t.text;
        ta.focus();
        const top = ta.getBoundingClientRect().top + window.scrollY - 120;
        window.scrollTo({ top, behavior: 'smooth' });
      } else {
        ui.smsBody = t.text;
        render();
      }
      break;
    }

    case 'send-sms':
      sendSms();
      break;
  }
});

/* ---------- 입력 이벤트 ---------- */
document.addEventListener('input', ev => {
  const t = ev.target;

  if (t.id === 'clientSearch'){
    ui.clientQuery = t.value;
    const box = $('#clientList');
    if (box) box.innerHTML = clientListHTML();
    return;
  }
  if (t.id === 'workerSearch'){
    ui.workerQuery = t.value;
    const box = $('#workerList');
    if (box) box.innerHTML = workerListHTML();
    return;
  }
  if (t.id === 'smsSearch'){
    ui.smsQuery = t.value;
    renderSmsList();
    return;
  }
  if (t.id === 'smsBody'){
    ui.smsBody = t.value;
    return;
  }
});

document.addEventListener('change', ev => {
  const t = ev.target;

  if (t.id === 'ledgerMonth'){
    ui.ledgerMonth = t.value;
    render();
    return;
  }
  if (t.dataset && t.dataset.lrate){
    setClientRate(t.dataset.lrate, t.value);
    render();
    toast(t.value ? '청구 시급을 ' + won(t.value) + '으로 저장했습니다' : '청구 시급을 지웠습니다 (수당 뺀 근무 급여와 같음)');
    return;
  }
  if (t.id === 'shiftWorkerFilter'){
    ui.shiftWorker = t.value;
    render();
    return;
  }
  if (t.id === 'smsAll'){
    const pool = smsPool();
    const q = ui.smsQuery.trim().toLowerCase();
    const visible = q ? pool.filter(x =>
      (x.name || '').toLowerCase().includes(q) ||
      (x.manager || '').toLowerCase().includes(q) ||
      (x.phone || '').includes(q) ||
      (x.address || '').toLowerCase().includes(q)
    ) : pool;
    if (t.checked) visible.forEach(x => ui.smsSel.add(x.id));
    else visible.forEach(x => ui.smsSel.delete(x.id));
    syncSmsSelection();
    return;
  }
  if (t.classList && t.classList.contains('sms-cb')){
    if (t.checked) ui.smsSel.add(t.value);
    else ui.smsSel.delete(t.value);
    syncSmsSelection();
    return;
  }
  if (t.name === 'adm'){
    // 라디오 선택만으로 전환하지 않고 '전환' 버튼으로 확정
    return;
  }
});

document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape'){
    closeTopModalFromUi();
  }
});

/* ============================================================
   시작
   ============================================================ */
DB = loadDB();
if (!DB.currentAdminId || !adminById(DB.currentAdminId)) DB.currentAdminId = (DB.admins[0] || {}).id;
/* 로그인 세션이 있으면 바로 들어가고, 없으면 로그인 화면부터 (데이터·DB 읽기 전) */
sessionLoad();
if (isLoggedIn()) DB.currentAdminId = AUTH.adminId;
else ui.loginAdmin = DB.currentAdminId;
render();
if (isLoggedIn()) initDb();
/* 로그인 화면에서도 관리자 이름·비밀번호는 다른 기기와 맞춘다 (인력·기록 같은 자료는 로그인 후에만) */
else syncAdminsFromDb();

/* 홈 화면에 추가(설치형 앱) — 캐시 없는 최소 서비스 워커 */
if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', () => {
    try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch(e){}
  });
}
</script>
</body>
</html>
