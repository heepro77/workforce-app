/* ============================================================
   앱으로 돌아왔을 때 다시 맞추기
   - 휴대폰에서 앱을 내려 두면 실시간 연결이 끊겨 그 사이의
     관리자 이름 변경을 놓친다. 화면으로 돌아오면 관리자 계정을
     다시 읽고, 오래 비어 있었으면 기록도 원격 DB 기준으로 맞춘다.
   ============================================================ */
let lastReturnSyncAt = 0;
function returnSync(){
  const now = Date.now();
  if (now - lastReturnSyncAt < 2000) return;   /* 화면 전환마다 반복하지 않는다 */
  lastReturnSyncAt = now;
  if (!SYNC.client && !ensureDbClient()) return;
  if (typeof syncAdminsFromDb === 'function') syncAdminsFromDb();
  if (!isLoggedIn()) return;
  if (SYNC.state === 'offline' && navigator.onLine !== false){ reconnectDb(); return; }
  if (SYNC.state === 'live' && !SYNC.busy && now - SYNC.lastLoadAt > 20000) loadFromDb(true);
}

document.addEventListener('visibilitychange', () => { if (!document.hidden) returnSync(); });
window.addEventListener('focus', returnSync);
window.addEventListener('pageshow', ev => { if (ev && ev.persisted) returnSync(); });
window.addEventListener('online', () => {
  if (SYNC.state === 'offline'){ reconnectDb(); return; }
  returnSync();
});


/* ============================================================
   관리자 로그인 · 비밀번호 · 기록 작성자 표시
   - 앱에 들어가면 관리자를 고르고 비밀번호를 넣어야 데이터가 보인다
   - 비밀번호는 SHA-256 해시로만 저장한다 (기본 1234)
   - 관리자 이름·비밀번호는 wf_admins 표로 관리자 3명 기기 사이에 맞춘다
     (표가 없으면 이 기기에만 저장하고 설정에 SQL 안내를 띄운다)
   ============================================================ */
const SESSION_KEY = 'wfp_session';
const ADMINS_TABLE = 'wf_admins';
const DEFAULT_ADMIN_PASS = '1234';
const PASS_PEPPER = 'wfp-adm-v1';
const AUTH = { adminId: '', at: 0 };

/* ---------- SHA-256 (외부 라이브러리 없이 어디서나 같은 값) ---------- */
function sha256Utf8Bytes(s){
  const out = [];
  for (let i = 0; i < s.length; i++){
    const c = s.charCodeAt(i);
    if (c < 0x80) out.push(c);
    else if (c < 0x800){ out.push(0xc0 | (c >> 6), 0x80 | (c & 63)); }
    else if (c >= 0xd800 && c <= 0xdbff && i + 1 < s.length){
      const c2 = s.charCodeAt(i + 1);
      if (c2 >= 0xdc00 && c2 <= 0xdfff){
        const cp = 0x10000 + ((c - 0xd800) << 10) + (c2 - 0xdc00);
        out.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
        i++;
      } else out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
    } else out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
  }
  return out;
}
const SHA256_K = [
  0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
];
function sha256Hex(str){
  const bytes = sha256Utf8Bytes(String(str == null ? '' : str));
  const bitLen = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  const hi = Math.floor(bitLen / 0x100000000), lo = bitLen >>> 0;
  bytes.push((hi >>> 24) & 255, (hi >>> 16) & 255, (hi >>> 8) & 255, hi & 255);
  bytes.push((lo >>> 24) & 255, (lo >>> 16) & 255, (lo >>> 8) & 255, lo & 255);

  let h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a,
      h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;
  const w = new Array(64);
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let off = 0; off < bytes.length; off += 64){
    for (let i = 0; i < 16; i++){
      w[i] = ((bytes[off + i * 4] << 24) | (bytes[off + i * 4 + 1] << 16) |
              (bytes[off + i * 4 + 2] << 8) | bytes[off + i * 4 + 3]) >>> 0;
    }
    for (let i = 16; i < 64; i++){
      const s0 = rotr(w[i-15], 7) ^ rotr(w[i-15], 18) ^ (w[i-15] >>> 3);
      const s1 = rotr(w[i-2], 17) ^ rotr(w[i-2], 19) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
    }
    let a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;
    for (let i = 0; i < 64; i++){
      const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
      const ch = (e & f) ^ ((~e) & g);
      const t1 = (h + S1 + ch + SHA256_K[i] + w[i]) >>> 0;
      const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + maj) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0;
      d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0;
    h4 = (h4 + e) >>> 0; h5 = (h5 + f) >>> 0; h6 = (h6 + g) >>> 0; h7 = (h7 + h) >>> 0;
  }
  return [h0, h1, h2, h3, h4, h5, h6, h7].map(x => ('00000000' + x.toString(16)).slice(-8)).join('');
}

/* ---------- 비밀번호 해시 · 확인 ---------- */
function passHashOf(adminId, pass){
  return sha256Hex(PASS_PEPPER + '|' + String(adminId || '') + '|' + String(pass == null ? '' : pass));
}
function adminPassHash(a){
  if (!a) return '';
  return String(a.passHash || '') || passHashOf(a.id, DEFAULT_ADMIN_PASS);
}
function checkAdminPass(adminId, pass){
  const a = adminById(adminId);
  if (!a) return false;
  return adminPassHash(a) === passHashOf(adminId, pass);
}
function adminHasOwnPass(a){ return !!(a && a.passHash); }

/* ---------- 로그인 세션 (localStorage) ---------- */
function sessionLoad(){
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const o = JSON.parse(raw);
    if (o && o.adminId && adminById(o.adminId)){
      AUTH.adminId = o.adminId;
      AUTH.at = Number(o.at) || 0;
      return o;
    }
  } catch(e){ /* 손상된 세션은 로그인 화면으로 */ }
  return null;
}

  AUTH.at = Date.now();
  try { localStorage.setItem(SESSION_KEY, JSON.stringify({ adminId: adminId, at: AUTH.at })); } catch(e){}
}
function sessionClear(){
  AUTH.adminId = '';
  AUTH.at = 0;
  try { localStorage.removeItem(SESSION_KEY); } catch(e){}
}
function isLoggedIn(){ return !!AUTH.adminId && !!adminById(AUTH.adminId); }

function adminInitial(a){
  const name = String((a && a.name) || '').trim();
  const m = name.match(/관리자\s*([0-9]+)/);
  if (m) return m[1].slice(-1);
  return name.slice(0, 1) || '?';
}

  document.body.classList.add('locked');
  const view = $('#view');
  if (view) view.innerHTML = viewLogin();

  if (chip && SYNC && SYNC.state === 'live'){ /* 잠긴 화면에서는 상태를 숨긴다 */ chip.hidden = true; }
}

function doLogin(){
  const passEl = $('#loginPass');
  const msg = $('#loginMsg');
  const said = text => { if (msg) msg.textContent = text; };
  const adminId = loginPickId();
  const pass = passEl ? String(passEl.value || '') : '';
  if (!adminId || !adminById(adminId)){ said('관리자를 선택해 주세요'); return; }
  if (!pass){ said('비밀번호를 입력해 주세요'); if (passEl) passEl.focus(); return; }
  if (!checkAdminPass(adminId, pass)){
    said('비밀번호가 맞지 않습니다');
    if (passEl){ passEl.value = ''; passEl.focus(); }
    return;
  }
  sessionSave(adminId);
  DB.currentAdminId = adminId;
  try { saveDB(); } catch(e){}
  document.body.classList.remove('locked');
  const chip = $('#dbChip');
  if (chip) chip.hidden = false;
  render();
  initDb();
  toast(aName(adminId) + ' 님으로 로그인했습니다');
}

function doLogout(){
  if (!isLoggedIn()){ render(); return; }
  const who = aName(AUTH.adminId);
  sessionClear();
  ui.tab = 'home';
  ui.smsSel = new Set();
  while (document.querySelector('.modal-wrap')) closeTopModalFromUi();
  render();
  toast(who + ' 님 로그아웃 · 비밀번호를 입력해 다시 들어올 수 있습니다');
}

/* ---------- wf_admins: 관리자 이름·비밀번호를 기기 사이에 맞춘다 ---------- */
/* 설정 창을 연 순간의 이름·역할. 이 값과 달라진 칸만 저장해, 그 사이 다른 기기에서
   바뀐 이름을 이 기기가 되돌리지 않게 한다. */
const ADM_EDIT_BASE = {};
function adminEditBase(a){ return ADM_EDIT_BASE[a.id] || { name: a.name, role: a.role || '' }; }

function adminRow(a, newPass){
  const row = {
    id: a.id,
    name: a.name || '',
    role: a.role || '',
    updated_by: AUTH.adminId || a.id,
    updated_at: new Date().toISOString()
  };
  /* 비밀번호 해시는 이 기기에서 확인한 값만 다시 보낸다.
     DB에 있는데 이 기기가 아직 못 읽은 해시를 기본값(1234)으로 덮어쓰지 않는다. */
  const local = a.passHash ? String(a.passHash) : '';
  const known = (a.syncedHash === undefined) ? null : String(a.syncedHash || '');
  if (newPass) row.pass_hash = adminPassHash(a);                 /* 지금 정한 새 비밀번호 */
  else if (!(SYNC.adminIds instanceof Set)) { /* 표를 못 읽었으니 해시는 건드리지 않는다 */ }
  else if (!SYNC.adminIds.has(a.id)) row.pass_hash = adminPassHash(a);   /* 이 기기가 처음 만드는 계정 */
  else if (local && (known === local || known === '')) row.pass_hash = local;
  return row;
}
function adminTableMissing(){ return !!(SYNC && SYNC.adminsMissing); }
function adminDbStateLine(){
  if (!SYNC.client || SYNC.state !== 'live') return '이 기기에만 저장됩니다 (DB 연결 대기)';
  if (adminTableMissing()) return 'wf_admins 표가 없어 이 기기에만 저장됩니다';
  return '관리자 3명 기기와 함께 맞춰집니다';
}
function syncAdminRow(a, newPass){
  if (!SYNC.client || SYNC.state !== 'live') return Promise.resolve(false);
  return SYNC.client.from(ADMINS_TABLE).upsert(adminRow(a, newPass), { onConflict: 'id' }).then(r => {
    if (r && r.error){
      if (isMissingTable(r.error)){
        SYNC.adminsMissing = true;
        SYNC.adminsError = String(r.error.message || '');
      } else {
        SYNC.adminsError = String(r.error.message || '');
      }
      return false;
    }
    SYNC.adminsMissing = false;
    SYNC.adminsError = '';
    return true;
  }).catch(e => {
    SYNC.adminsError = String((e && e.message) || e);
    return false;
  });
}
function adoptAdminRow(row){
  if (!row || !row.id) return false;
  let a = adminById(row.id);
  if (!a){
    a = { id: row.id, name: row.name || '관리자', role: row.role || '', passHash: row.pass_hash || '', syncedHash: row.pass_hash || '' };
    DB.admins.push(a);
    return true;
  }
  let changed = false;
  if (row.name && row.name !== a.name){ a.name = row.name; changed = true; }
  if (row.role !== undefined && row.role !== null && row.role !== a.role){ a.role = row.role; changed = true; }
  if (row.pass_hash && row.pass_hash !== a.passHash){ a.passHash = row.pass_hash; changed = true; }
  /* DB에 있는 값 — 이 기기에서 다시 보낼 때 이 값과 같을 때만 해시를 싣는다 */
  if (row.pass_hash !== undefined) a.syncedHash = row.pass_hash || '';
  return changed;
}
function loadAdminsFromDb(){
  if (!SYNC.client) return Promise.resolve(false);
  const finish = r => {
    const err = r && r.error;
    if (err){
      if (isMissingTable(err)){ SYNC.adminsMissing = true; SYNC.adminsError = String(err.message || ''); }
      else if (!r) SYNC.adminsMissing = false;
      return false;
    }
    SYNC.adminsMissing = false;
    SYNC.adminsError = '';
    const rows = Array.isArray(r.data) ? r.data : [];
    SYNC.adminsLoaded = true;
    SYNC.adminIds = new Set(rows.filter(x => x && x.id).map(x => x.id));   /* 이 표에 실제로 있는 계정 */
    if (!rows.length) return true;      /* 아직 올린 계정이 없으면 이 기기 기본값(1234)을 쓴다 */
    let changed = false;
    rows.forEach(row => { if (adoptAdminRow(row)) changed = true; });
    if (changed){
      if (!adminById(DB.currentAdminId)) DB.currentAdminId = (DB.admins[0] || {}).id;
      if (AUTH.adminId && !adminById(AUTH.adminId)) sessionClear();
      try { saveDB(); } catch(e){}
    }
    return true;
  };
  return new Promise(resolve => {
    let done = false;
    const once = r => { if (done) return; done = true; resolve(r || {}); };
    const timer = setTimeout(() => once({ error: { message: '응답 시간 초과', code: 'timeout' } }), 12000);
    try {
      SYNC.client.from(ADMINS_TABLE).select('*').limit(50)
        .then(r => { clearTimeout(timer); once(r); })
        .catch(e => { clearTimeout(timer); once({ error: { message: String((e && e.message) || e) } }); });
    } catch(e){ clearTimeout(timer); once({ error: { message: String((e && e.message) || e) } }); }
  }).then(finish);
}
function onAdminChange(payload){
  const type = payload && (payload.eventType || payload.event_type);
  if (type === 'DELETE') return;
  const row = (payload && payload.new) || null;
  if (!row) return;
  if (adoptAdminRow(row)){
    try { saveDB(); } catch(e){}
    try { renderHeader(); } catch(e){}
    if (isLoggedIn()) scheduleRender();
    else if (typeof paintLoginAdmins === 'function') paintLoginAdmins();   /* 로그인 화면의 이름도 바로 */
  }
}

function byBadge(id, prefix){
  const label = prefix || '기록';
  return '<span class="by-badge">' + esc(label) + ': ' + esc(writerName(id)) + '</span>';
}
function byBadgeOfRows(rows, prefix){
  const ids = [];
  (rows || []).forEach(r => {
    const id = r && r.createdBy;
    if (id && ids.indexOf(id) < 0) ids.push(id);
  });
  if (!ids.length) return byBadge('', prefix);
  if (ids.length === 1) return byBadge(ids[0], prefix);
  return '<span class="by-badge">' + esc(prefix || '기록') + ': ' + esc(writerName(ids[0])) + ' 외 ' + (ids.length - 1) + '명</span>';
}

/* ============================================================
   스크롤 유지
   화면을 다시 그릴 때(내가 삭제·추가·수정·출근 토글한 뒤, 다른 관리자의
   변경이 실시간으로 들어왔을 때, 화면에 돌아와 다시 맞췄을 때) 보던 자리가
   맨 위로 튀지 않게, 그리기 직전 위치를 기억했다가 그대로 되돌린다.
   탭을 옮길 때만 맨 위로 올린다.
   ============================================================ */
/* 창 스크롤 말고 따로 스크롤되는 상자 (세로: 메신저 대화, 가로: 필터 칩 줄) */
const SCROLL_KEEP_SEL = '#view .chat-list, #view .chips, #view .tag-row, #view .tpl-row, #view .freq-chips';
let lastRenderTab = null;   /* 마지막으로 그린 탭 — 같은 탭을 다시 그리는지 판단 */

function scrollSnapshot(){
  let top = 0;
  try { top = Math.max(0, Math.round(window.scrollY || window.pageYOffset || 0) || 0); } catch(e){ top = 0; }
  const inner = $$(SCROLL_KEEP_SEL).map(el => ({ top: el.scrollTop || 0, left: el.scrollLeft || 0 }));
  return { top: top, inner: inner };
}

function restoreScroll(snap){
  if (!snap) return;
  const apply = () => {
    try { window.scrollTo({ top: snap.top, behavior: 'auto' }); }
    catch(e){ try { window.scrollTo(0, snap.top); } catch(e2){} }
    $$(SCROLL_KEEP_SEL).forEach((el, i) => {
      const was = snap.inner[i];
      if (!was) return;
      try {
        if (was.top) el.scrollTop = was.top;
        if (was.left) el.scrollLeft = was.left;
      } catch(e){}
    });
  };
  apply();
  /* 사진·줄바꿈이 한 프레임 늦게 자리를 잡아도 한 번 더 맞춘다 */
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(apply);
}

function render(resetScroll){
  if (!isLoggedIn()){ renderLocked(); lastRenderTab = ui.tab; return; }
  /* 같은 화면을 다시 그리는 것이면 지금 보던 자리를 기억해 둔다 */
  const keep = (!resetScroll && lastRenderTab === ui.tab) ? scrollSnapshot() : null;
  document.body.classList.remove('locked');
  repairQpInDB(SYNC.state === 'live');
  if (!$$('.modal-wrap').length) navReplace({ tab: ui.tab });
  renderHeader();
  const views = {
    home: viewHome, shifts: viewShifts, workers: viewWorkers,
    clients: viewClients, sms: viewSms, messenger: viewMessenger, ledger: viewLedger
  };
  document.body.classList.toggle('chatting', ui.tab === 'messenger');
  $('#view').innerHTML = (views[ui.tab] || viewHome)();
  renderTabbar();
  if (ui.tab === 'sms') syncSmsSelection();
  if (ui.tab === 'messenger'){ markChatRead(); scrollChatBottom(); }
  else if (keep) restoreScroll(keep);
  else window.scrollTo({ top: 0, behavior: 'auto' });
  lastRenderTab = ui.tab;
  renderDirty = false;
}

/* ---------------- 홈 ---------------- */
function viewHome(){
  const today = dispatchDateKey();
  const todays = DB.shifts.filter(s => s.date === today);
  const cDue = DB.shifts.filter(s => !s.clientPaid);
  const wDue = DB.shifts.filter(s => !s.workerPaid);
  const cSum = sumWage(cDue);
  const wSum = sumWage(wDue);
  const regN = DB.workers.filter(w => w.status !== RESERVE).length;
  const resN = DB.workers.length - regN;
  const recent = DB.shifts.slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 3);
  const msgs = DB.messages.slice().sort((a, b) => String(b.at).localeCompare(String(a.at))).slice(0, 2);

  /* 상단 알약은 지금 근무중(ON)인 건만 — 이미 마감된 지난 회차는 근무·입금 탭에서 본다 */
  const todayOpen = todays.filter(isOpenShift);
  const todayPills = todayOpen.length
    ? todayOpen.map(s => {
        const tw = workerById(s.workerId);
        return '<button class="pill" data-act="today-edit" data-id="' + s.id + '">' + esc(wName(s)) +
          (tw ? ageGroupBadge(tw) : '') +
          ' · ' + esc(onOffText(s)) + (allowanceOf(s) ? ' · 수당 ' + won(allowanceOf(s)) : '') + (s.place ? ' · ' + esc(s.place) : '') + ' ✎</button>';
      }).join('')
    : '<span class="pill">지금 근무중(ON)인 출역이 없습니다</span>';

  const onN = DB.workers.filter(w => todays.some(s => s.workerId === w.id)).length;
  const busyN = DB.workers.filter(w => todays.some(s => s.workerId === w.id && isOpenShift(s))).length;
  const offN = Math.max(0, DB.workers.length - busyN);
  const workerHasToday = w => todays.some(s => s.workerId === w.id);
  const workerIsOn = w => todays.some(s => s.workerId === w.id && isOpenShift(s));
  /* 출근: 오늘 기준일로 '출근' 버튼을 누른 인력 (ON 이면 누르지 않아도 출근으로 본다) */
  const workerAtt = w => attendInfoOf(w, today, todays.filter(s => s.workerId === w.id));
  const workerAttended = w => !!workerAtt(w);
  const attN = DB.workers.filter(workerAttended).length;
  const rosterRank = w => workerIsOn(w) ? 0 : (workerAttended(w) ? 1 : 2);

  /* 연령대별 인원 (출역 화면 상단 칩·필터) */
  const ageCount = {};
  DB.workers.forEach(w => { const k = ageGroupKey(w) || '_none'; ageCount[k] = (ageCount[k] || 0) + 1; });
  const todayAge = (ui.todayAge !== 'all' && (ageCount[ui.todayAge] || 0) > 0) ? ui.todayAge : 'all';
  const todayStatus = ui.todayStatus || 'all';

  const sortRoster = (a, b) => (rosterRank(a) - rosterRank(b)) ||
    ((a.status === RESERVE ? 1 : 0) - (b.status === RESERVE ? 1 : 0));
  const rosterWorkers = DB.workers
    .filter(w => todayAge === 'all' || (ageGroupKey(w) || '_none') === todayAge)
    .filter(w => {
      if (todayStatus === 'att') return workerAttended(w);
      if (todayStatus === 'on') return workerIsOn(w);
      if (todayStatus === 'off') return !workerIsOn(w);
      return true;
    })
    .slice()
    .sort(sortRoster);

  const rosterItem = w => {
    const rows = todays.filter(s => s.workerId === w.id).sort((a, b) => timeMin(a.start) - timeMin(b.start));
    const open = rows.filter(isOpenShift)[0];
    const done = rows.filter(s => !isOpenShift(s));
    const on = !!open;
    const att = attendInfoOf(w, today, rows);
    const sumWageW = rows.reduce((a, s) => a + num(s.wage), 0);
    const sumMin = rows.reduce((a, s) => a + Math.round(num(hoursOf(s)) * 60), 0);
    const sub = open
      ? 'ON ' + onHM(open) + ' · 근무중' + (openMinutes(open) >= 1 ? ' ' + elapsedLabel(openMinutes(open)) + ' 경과' : '') + (open.place ? ' · ' + open.place : '')
      : (done.length
          ? '오늘 ' + done.length + '건 · ' + durLabel(sumMin) + (sumWageW ? ' · 일당 ' + won(sumWageW) : '')
          : (att
              ? '출근 완료 · 근무 기록 없음'
              : (w.status === RESERVE ? '예비 인력 · 오늘 미출역' : '오늘 미출역')));

    /* 오늘 출역은 현 상황만 — 마감된 지난 회차 기록은 근무·입금 탭·장부에서 본다 */
    const attLine = att
      ? '<div class="roster-att">' +
          '<span class="badge att">출근 완료</span>' +
          (att.at ? '<span>' + esc(hmOf(att.at)) + '</span>' : '') +
          (att.by ? byBadge(att.by, '출근') : '') +
        '</div>'
      : '';
    const attBtn = '<button class="att-btn' + (att ? ' on' : '') + '" data-act="today-attend" data-worker="' + w.id + '"' +
      ' aria-pressed="' + (att ? 'true' : 'false') + '" aria-label="' + esc(w.name) + ' 출근 ' + (att ? '완료 · 다시 누르면 해제' : '체크') + '">' +
      (att ? '출근 완료' : '출근') + '</button>';

    return '<div class="roster-item' + (on ? ' on' : '') + '" data-age="' + esc(ageGroupKey(w)) + '">' +
      '<div class="roster-row' + (on ? ' on' : '') + '">' +
        '<div class="roster-id"><div class="roster-name"><b>' + esc(w.name) + '</b>' + ageGroupBadge(w, { none: true }) + '</div>' +
          '<span class="roster-sub">' + esc(sub) + '</span>' +
          attLine +
          (open ? '<div class="roster-by">' + byBadge(open.createdBy) + '</div>' : '') +
          '<div class="roster-acts">' + attBtn +
            '<button class="mini" data-act="worker-shifts" data-id="' + w.id + '">근무 내역</button>' +
            (open ? '<button class="mini" data-act="today-edit" data-id="' + open.id + '">시간·거래처</button>' : '') +
            (open ? '<button class="mini danger" data-act="del-shift" data-id="' + open.id + '">삭제</button>' : '') +
          '</div>' +
        '</div>' +
        '<button class="switch' + (on ? ' on' : '') + '" data-act="today-toggle" data-worker="' + w.id + '" aria-pressed="' + (on ? 'true' : 'false') + '" aria-label="' + esc(w.name) + ' 오늘 출역 ' + (on ? 'ON' : 'OFF') + '">' + (on ? 'ON' : 'OFF') + '</button>' +
      '</div>' +
    '</div>';
  };

  /* 상태별로 묶어 보여 준다: 출역 중(ON) → 출근 후 마감(OFF) → 미출역(OFF) */
  const rankHead = [
    { t: '출역 중 (ON)', c: 'on' },
    { t: '출근 · 마감 (OFF)', c: 'done' },
    { t: '미출역 (OFF)', c: 'idle' }
  ];
  let lastRank = -1;
  const rosterParts = [];
  rosterWorkers.forEach(w => {
    const r = rosterRank(w);
    if (todayStatus === 'all' && r !== lastRank){
      const n = rosterWorkers.filter(x => rosterRank(x) === r).length;
      rosterParts.push('<div class="rgroup ' + rankHead[r].c + '">' + rankHead[r].t + ' <i>' + n + '명</i></div>');
      lastRank = r;
    }
    rosterParts.push(rosterItem(w));
  });

  const ageChip = (val, label, n, title) => '<button class="chip age-chip' + (todayAge === val ? ' on' : '') + '"' +
    (title ? ' title="' + esc(title) + '"' : '') + ' data-act="today-age" data-val="' + val + '">' + label + ' <i>' + n + '</i></button>';
  const ageChips = DB.workers.length
    ? '<div class="chips age-chips">' + ageChip('all', '연령대 전체', DB.workers.length) +
        AGE_GROUPS.filter(g => (ageCount[g.key] || 0) > 0).map(g => ageChip(g.key, esc(g.key), ageCount[g.key], g.label)).join('') +
        ((ageCount._none || 0) ? ageChip('_none', '미지정', ageCount._none, '연령대 미지정') : '') +
      '</div>'
    : '';

  const boardCell = (val, n, label, cls) => '<button class="tb ' + cls + (todayStatus === val ? ' on' : '') + '" data-act="today-status" data-val="' + val + '">' +
    '<b>' + n + '</b><span>' + label + '</span></button>';
  const todayBoard = DB.workers.length
    ? '<div class="today-board">' +
        boardCell('all', DB.workers.length, '전체 인원', 'all') +
        boardCell('att', attN, '출근', 'att') +
        boardCell('on', busyN, 'ON', 'on') +
        boardCell('off', offN, 'OFF', 'off') +
      '</div>'
    : '';

  const rosterHTML = DB.workers.length
    ? '<h2 class="sec">오늘 출역 체크 <span class="muted" style="font-size:12px;font-weight:700">' + onN + '/' + DB.workers.length + '명 출역' +
      (busyN ? ' · 근무중 ' + busyN + '명' : '') + '</span></h2>' +
      ageChips +
      '<div class="roster">' + (rosterParts.length ? rosterParts.join('') : '<div class="roster-empty">조건에 맞는 인력이 없습니다 · 위 필터를 바꿔 보세요.</div>') + '</div>' +
      '<p class="form-note">출근을 누르면 오늘 출근으로 표시되고, 다시 누르면 해제됩니다 · ON을 누르면 확인한 순간의 시각으로 시작되고 출근도 함께 체크됩니다 · OFF는 그 순간의 시각이 종료로 기록됩니다</p>'
    : '<div class="card muted" style="font-size:12.5px">등록된 인력이 없습니다. <b>인력</b> 탭에서 먼저 추가하세요.</div>';

  const msgBits = msgs.length ? msgs.map(m => {
    const modeLabel = m.mode === 'client' ? '거래처' : '예비 인력';
    return '<div class="rec" style="margin-bottom:6px">' +
      '<div class="rec-top"><div class="rec-who" style="font-size:13px">' + esc(modeLabel) + ' 문자 <span class="badge cnt">' + m.count + '건</span></div>' +
      '<span class="msg-time">' + fmtDT(m.at) + '</span></div>' +
      '<div class="rec-meta">' + esc((m.recipients || []).slice(0, 3).join(', ')) + ((m.recipients || []).length > 3 ? ' 외 ' + (m.recipients.length - 3) + '명' : '') + ' ' + byBadge(m.managerId) + '</div>' +
      '</div>';
  }).join('') : '<div class="card muted" style="font-size:12.5px">아직 보낸 문자가 없습니다.</div>';

  return '' +
  '<section class="hero">' +
    '<div class="hero-top"><span>오늘 출역</span><span>' + fmtDate(today) + '</span></div>' +
    '<div class="hero-cap">낮 12시에 새 출역으로 리셋 · 기준 ' + esc(today) + '</div>' +
    '<div class="hero-num">' + attN + '<small>명 출근</small></div>' +
    '<div class="hero-sub">출근 ' + attN + '명 · <b>ON</b> ' + busyN + '명 · <b>OFF</b> ' + offN + '명</div>' +
    todayBoard +
    '<div class="hero-list">' + todayPills + '</div>' +
    '<div class="hero-acts">' +
      '<button class="hero-btn" data-act="quick-shift">⏱ 오늘 근무시간 등록</button>' +
    '</div>' +
  '</section>' +

  rosterHTML +

  '<div class="grid2">' +
    '<button class="stat" data-act="tab" data-tab="shifts">' +
      '<span class="stat-k">🏢 거래처 미입금 · 수금 대기</span>' +
      '<span class="stat-v sm money-in">' + won(cSum) + '</span>' +
      '<span class="stat-s in">' + cDue.length + '건 받을 돈</span>' +
    '</button>' +
    '<button class="stat" data-act="tab" data-tab="shifts">' +
      '<span class="stat-k">👷 인력 미입금 · 지급 대기</span>' +
      '<span class="stat-v sm money-out">' + won(wSum) + '</span>' +
      '<span class="stat-s money">' + wDue.length + '건 줄 돈</span>' +
    '</button>' +
    '<button class="stat" data-act="tab" data-tab="workers">' +
      '<span class="stat-k">등록 인력</span>' +
      '<span class="stat-v">' + DB.workers.length + '<small>명</small></span>' +
      '<span class="stat-s">정규 ' + regN + ' · 예비 ' + resN + '</span>' +
    '</button>' +
    '<button class="stat" data-act="tab" data-tab="clients">' +
      '<span class="stat-k">거래처</span>' +
      '<span class="stat-v">' + DB.clients.length + '<small>곳</small></span>' +
      '<span class="stat-s">검색으로 바로 찾기</span>' +
    '</button>' +
    '<button class="stat wide" data-act="tab" data-tab="sms">' +
      '<span class="stat-k">보낸 문자</span>' +
      '<span class="stat-v sm">' + DB.messages.reduce((a, m) => a + num(m.count), 0) + '<small>건 · ' + DB.messages.length + '회</small></span>' +
    '</button>' +
  '</div>' +

  '<h2 class="sec">빠른 실행</h2>' +
  '<div class="quick">' +
    '<button class="quick-btn" data-act="add-shift"><span>📝</span>근무 등록</button>' +
    '<button class="quick-btn" data-act="sms-go" data-mode="worker"><span>📨</span>예비인력 문자</button>' +
    '<button class="quick-btn" data-act="sms-go" data-mode="client"><span>🏢</span>거래처 문자</button>' +
  '</div>' +

  '<h2 class="sec">최근 근무 기록</h2>' +
  (recent.length ? recent.map(recHTML).join('') :
    '<div class="card muted" style="font-size:12.5px">기록이 없습니다. 위의 <b>근무 등록</b>으로 시작하세요.</div>') +

  '<h2 class="sec">최근 문자 발송</h2>' + msgBits +
  '<h2 class="sec">관리자 메신저' + (unreadChat() ? ' <span class="badge wait">새 ' + unreadChat() + '건</span>' : '') + '</h2>' +
  chatbotPreviewHTML() +

  '<p class="foot">실제 문자는 발송되지 않습니다 · 기록은 ' +
    (SYNC.state === 'live' ? 'Supabase 실시간 DB에 저장되어 관리자 3명이 함께 봅니다' : '이 브라우저에만 저장됩니다 (DB 연결 대기중)') +
    '.<br>기본 시급 ' + won(RATE) + ' · 휴게시간 없이 근무시간만 계산합니다.</p>';
}

/* ---------------- 근무·입금 ---------------- */
function payCellHTML(s, kind){
  const done = kind === 'client' ? !!s.clientPaid : !!s.workerPaid;
  const date = kind === 'client' ? s.clientPaidDate : s.workerPaidDate;
  const by = kind === 'client' ? s.clientPaidBy : s.workerPaidBy;
  const label = kind === 'client' ? '거래처 입금' : '인력 입금';
  return '<div class="pay ' + kind + (done ? ' done' : '') + '">' +
    '<div class="pay-h"><span>' + label + '</span>' +
      '<span class="badge ' + (done ? 'ok' : 'wait') + '">' + (done ? '입금완료' : '미입금') + '</span></div>' +
    '<div class="pay-m">' + (done
      ? '입금일 ' + esc(fmtDate(date)) + ' · ' + esc(aName(by))
      : (kind === 'client' ? '받을 돈 · 수금 전' : '줄 돈 · 지급 전')) + '</div>' +
    '<button class="mini ' + (done ? '' : 'ok') + '" data-act="toggle-' + kind + '-paid" data-id="' + s.id + '">' +
      (done ? '입금취소' : '입금완료 처리') + '</button>' +
  '</div>';
}

function recHTML(s){
  const both = !!(s.clientPaid && s.workerPaid);
  const hours = hoursOf(s);
  const open = isOpenShift(s);
  return '<div class="rec ' + (both ? 'is-done' : '') + '">' +
    '<div class="rec-top">' +
      '<div class="rec-who">' + esc(wName(s)) + ageGroupBadge(workerById(s.workerId)) +
        (open ? '<span class="badge wait">근무중</span>' : '') +
        (both ? '<span class="badge ok">정산완료</span>' : '') +
      '</div>' +
      '<div class="rec-amt">' + (open ? '진행중' : won(s.wage)) +
        (open ? '<small>OFF를 누르면 일당이 계산됩니다</small>' : '<small>시급 ' + won(s.rate) + ' × ' + hours + '시간' + (allowanceOf(s) ? ' + 수당 ' + won(allowanceOf(s)) : '') + '</small>') + '</div>' +
    '</div>' +
    '<div class="rec-meta">' + esc(fmtDate(s.date)) + ' · ' + esc(onOffText(s)) +
      (open ? '' : ' (' + hoursLabel(s) + (isAdjusted(s) ? ' · 고침' : '') + ')') + ' · ' + esc(s.place || '-') + '</div>' +
    (s.memo ? '<div class="rec-memo">' + esc(s.memo) + '</div>' : '') +
    (allowanceOf(s) ? '<div class="rec-memo" style="color:#8a6400">수당 ' + won(allowanceOf(s)) + (s.allowanceMemo ? ' · ' + esc(s.allowanceMemo) : '') + '</div>' : '') +
    (open ? '' : '<div class="paygrid">' + payCellHTML(s, 'client') + payCellHTML(s, 'worker') + '</div>') +
    '<div class="rec-foot">' +
      '<span class="rec-by">' + byBadge(s.createdBy) +
        (s.updatedBy && s.updatedBy !== s.createdBy ? ' ' + byBadge(s.updatedBy, '수정') : '') + '</span>' +
      '<span class="rec-acts">' +
        (open ? '' : '<button class="mini" data-act="billing-sms" data-id="' + s.id + '">계좌 문자</button>') +
        '<button class="mini" data-act="edit-shift" data-id="' + s.id + '">' + (open ? '마감·거래처' : '수정') + '</button>' +
        '<button class="mini danger" data-act="del-shift" data-id="' + s.id + '">삭제</button>' +
      '</span>' +
    '</div>' +
  '</div>';
}

function viewShifts(){
  const base = DB.shifts.filter(s => ui.shiftWorker === 'all' || s.workerId === ui.shiftWorker);
  const cDue = base.filter(s => !s.clientPaid);
  const wDue = base.filter(s => !s.workerPaid);
  const cDone = base.filter(s => s.clientPaid);
  const wDone = base.filter(s => s.workerPaid);
  const doneAll = base.filter(s => s.clientPaid && s.workerPaid);

  let list = base.filter(s => {
    if (ui.shiftStatus === 'client-unpaid') return !s.clientPaid;
    if (ui.shiftStatus === 'worker-unpaid') return !s.workerPaid;
    if (ui.shiftStatus === 'done') return s.clientPaid && s.workerPaid;
    return true;
  });
  list.sort((a, b) => b.date.localeCompare(a.date) || timeMin(b.start) - timeMin(a.start));

  const groups = [];
  let last = null;
  list.forEach(s => {
    if (!last || last.date !== s.date){ last = { date: s.date, rows: [] }; groups.push(last); }
    last.rows.push(s);
  });

  const workerOpts = '<option value="all"' + (ui.shiftWorker === 'all' ? ' selected' : '') + '>전체 인력</option>' +
    DB.workers.map(w => '<option value="' + w.id + '"' + (ui.shiftWorker === w.id ? ' selected' : '') + '>' +
      esc(w.name) + (ageGroupKey(w) ? ' · ' + esc(ageGroupKey(w)) : '') + (w.status === RESERVE ? ' (예비)' : '') + '</option>').join('');

  const body = groups.length ? groups.map(g => {
    const sum = sumWage(g.rows);
    return '<div class="daygroup">' +
      '<div class="dayhead"><b>' + esc(fmtDate(g.date)) + '</b><span>' + g.rows.length + '건 · ' + won(sum) + '</span></div>' +
      g.rows.map(recHTML).join('') +
    '</div>';
  }).join('') :
    '<div class="empty"><span class="big">📋</span>조건에 맞는 근무 기록이 없습니다.' +
      '<br><button class="btn primary" data-act="add-shift" style="margin-top:12px">근무 등록</button></div>';

  return '' +
  '<div class="sumbar">' +
    '<div class="sumcell in wait">' +
      '<div class="k">🏢 거래처 미입금 · 수금 대기</div>' +
      '<div class="v">' + won(sumWage(cDue)) + '</div>' +
      '<div class="n">' + cDue.length + '건 · 완료 ' + cDone.length + '건 ' + won(sumWage(cDone)) + '</div>' +
    '</div>' +
    '<div class="sumcell out wait">' +
      '<div class="k">👷 인력 미입금 · 지급 대기</div>' +
      '<div class="v">' + won(sumWage(wDue)) + '</div>' +
      '<div class="n">' + wDue.length + '건 · 완료 ' + wDone.length + '건 ' + won(sumWage(wDone)) + '</div>' +
    '</div>' +
  '</div>' +
  '<div class="chips">' +
    '<button class="chip ' + (ui.shiftStatus === 'all' ? 'on' : '') + '" data-act="shift-status" data-val="all">전체 ' + base.length + '</button>' +
    '<button class="chip ' + (ui.shiftStatus === 'client-unpaid' ? 'on' : '') + '" data-act="shift-status" data-val="client-unpaid">거래처 미입금 ' + cDue.length + '</button>' +
    '<button class="chip ' + (ui.shiftStatus === 'worker-unpaid' ? 'on' : '') + '" data-act="shift-status" data-val="worker-unpaid">인력 미입금 ' + wDue.length + '</button>' +
    '<button class="chip ' + (ui.shiftStatus === 'done' ? 'on' : '') + '" data-act="shift-status" data-val="done">정산 완료 ' + doneAll.length + '</button>' +
  '</div>' +
  '<p class="legend"><b>거래처 입금</b> = 거래처에서 받는 돈(수금) · <b>인력 입금</b> = 인력에게 주는 돈(지급). 두 가지를 따로 기록하고 각각 처리합니다.</p>' +
  '<div class="toolbar">' +
    '<select class="select" id="shiftWorkerFilter" aria-label="인력별 보기">' + workerOpts + '</select>' +
    '<button class="btn primary" data-act="add-shift" style="padding:11px 15px;white-space:nowrap">+ 근무 등록</button>' +
  '</div>' +
  body;
}

/* 인력 카드 1장 — 이름 옆 색 배지 + 연령대 용어·나이 */
function workerCardHTML(w){
  const unpaid = sumWage(DB.shifts.filter(s => s.workerId === w.id && !s.workerPaid));
  const freq = workerClientStats(w.id);
  const freqTop = freq.slice(0, 3);
  const g = ageGroupOfWorker(w);
  const ageTxt = (w.age == null || w.age === '') ? '나이 미입력' : '만 ' + esc(w.age) + '세';
  return '<div class="wcard" data-age="' + esc(ageGroupKey(w)) + '">' +
    '<div class="wcard-top">' +
      '<div>' +
        '<div class="wcard-name">' + esc(w.name) + ageGroupBadge(w, { none: true }) +
          '<span class="badge ' + (w.status === RESERVE ? 'res' : 'reg') + '">' + esc(w.status) + '</span>' +
        '</div>' +
        '<div class="wcard-sub">' + esc(w.phone || '-') + '</div>' +
      '</div>' +
      '<div class="wcard-wage">' + num(w.rate).toLocaleString('ko-KR') + '<small>원/시간</small></div>' +

/* ============================================================
   개인별 거래처 통계 — 누가 어느 거래처에 몇 번 갔는지
   ============================================================ */
function workerClientStats(workerId){
  const map = new Map();
  (DB.shifts || []).forEach(s => {
    if (!workerId || s.workerId !== workerId) return;
    const c = s.clientId && s.clientId !== '__custom' ? clientById(s.clientId) : null;
    const name = (c && c.name) || s.place || '';
    if (!name) return;
    const key = c ? c.id : 'name:' + name;
    const o = map.get(key) || { key: key, clientId: c ? c.id : '', name: name, count: 0, hours: 0, pay: 0, last: '' };
    o.count++;
    o.hours += hoursOf(s);
    o.pay += num(s.wage);
    if (String(s.date || '') > o.last) o.last = s.date || '';
    map.set(key, o);
  });
  return Array.from(map.values()).sort((a, b) =>
    (b.count - a.count) || String(b.last).localeCompare(String(a.last)) || (b.hours - a.hours)
  );
}
/* 거래처 후보를 이 인력이 자주 간 순으로 정렬 */
function sortClientsByFreq(list, workerId){
  const freq = workerClientStats(workerId);
  const rank = new Map(), cnt = new Map();
  freq.forEach((o, i) => { if (o.clientId){ rank.set(o.clientId, i); cnt.set(o.clientId, o.count); } });
  return list.slice().sort((a, b) => {
    const ra = rank.has(a.id) ? rank.get(a.id) : 9999;
    const rb = rank.has(b.id) ? rank.get(b.id) : 9999;
    if (ra !== rb) return ra - rb;
    return String(a.name || '').localeCompare(String(b.name || ''));
  });
}
function freqChipsHTML(workerId, picked){
  const top = workerClientStats(workerId).filter(o => o.clientId).slice(0, 6);

}
function openWorkerStats(workerId){
  const w = workerById(workerId);
  if (!w) return;
  const stats = workerClientStats(workerId);
  const totalN = stats.reduce((a, o) => a + o.count, 0);

function syncSmsSelection(){
  const pool = smsPool();
  const ids = pool.map(x => x.id);
  const sel = Array.from(ui.smsSel).filter(id => ids.includes(id));
  ui.smsSel = new Set(sel);

  $$('.sms-cb').forEach(cb => {
    const on = ui.smsSel.has(cb.value);
    cb.checked = on;
    const pick = cb.closest('.pick');
    if (pick) pick.classList.toggle('is-on', on);
    const tag = pick && pick.querySelector('.pick-tag');
    if (tag) tag.classList.toggle('on', on);
  });

  const all = $('#smsAll');
  if (all){
    all.checked = pool.length > 0 && sel.length === pool.length;
    all.indeterminate = sel.length > 0 && sel.length < pool.length;
  }
  const cnt = $('#sendCount');
  if (cnt) cnt.innerHTML = sel.length + '명 선택<small>' + (ui.smsMode === 'client' ? '거래처' : '예비 인력') + ' 문자</small>';
  const btn = $('#sendBtn');
  if (btn) btn.disabled = sel.length === 0;
}

function renderSmsList(){
  const el = $('#smsList');
  if (el) el.innerHTML = smsListHTML();
  syncSmsSelection();
}

/* ============================================================
   안드로이드 뒤로가기 — 모달은 닫히고, 탭은 직전 탭으로
   ============================================================ */
const NAV = { seq: 0, pending: 0 };
const NAV_TABS = ['home', 'shifts', 'workers', 'clients', 'sms', 'messenger', 'ledger'];

function navPush(state){
  try { history.pushState(state, ''); } catch(e){}
}
function navReplace(state){
  try {
    if (history.state && history.state.modal) return;   /* 모달 진입 상태는 건드리지 않는다 */
    history.replaceState(state, '');
  } catch(e){}
}
function navStateModal(){
  return (history.state && history.state.modal) || '';
}
function navStateTab(){
  const st = history.state;
  return st && st.tab ? st.tab : '';
}
function topModalEl(){
  const list = $$('.modal-wrap');
  return list.length ? list[list.length - 1] : null;
}
function closeTopModalFromUi(){
  const top = topModalEl();
  if (!top) return false;
  if (top.__closeNav) top.__closeNav();
  else { top.remove(); document.body.style.overflow = ''; }
  return true;
}
window.addEventListener('popstate', () => {
  if (NAV.pending > 0){ NAV.pending--; return; }
  const top = topModalEl();
  if (top){
    if (top.__closeFromHistory) top.__closeFromHistory();
    else { top.remove(); document.body.style.overflow = ''; }
    return;
  }
  const t = navStateTab();
  if (t && t !== ui.tab && NAV_TABS.indexOf(t) >= 0){
    ui.tab = t;
    render();
  }
});

function openModal(opts){
  const wrap = document.createElement('div');
  wrap.className = 'modal-wrap';
  wrap.innerHTML =
    '<div class="modal-backdrop"></div>' +
    '<div class="modal" role="dialog" aria-modal="true">' +
      '<div class="modal-hd">' +
        '<div><h2>' + esc(opts.title) + '</h2>' + (opts.sub ? '<p>' + esc(opts.sub) + '</p>' : '') + '</div>' +
        '<button class="icon-btn" data-close aria-label="닫기">✕</button>' +
      '</div>' +
      '<div class="modal-body">' + (opts.body || '') + '</div>' +
      (opts.noFooter ? '' :
        '<div class="modal-ft">' +
          (opts.cancelLabel === false ? '' : '<button type="button" class="btn ghost" data-close>취소</button>') +
          '<button type="button" class="btn primary" data-submit>' + esc(opts.submitLabel || '저장') + '</button>' +
        '</div>') +
    '</div>';
  document.body.appendChild(wrap);
  document.body.style.overflow = 'hidden';
  const navToken = 'm' + (++NAV.seq);
  wrap.setAttribute('data-nav', navToken);
  navPush({ modal: navToken, tab: ui.tab });
  const close = (fromHistory) => {
    if (!wrap.parentNode) return;
    wrap.remove();
    document.body.style.overflow = '';
    if (renderDirty){
      renderDirty = false;
      setTimeout(() => { try { render(); } catch(e){} }, 0);
    }
    if (!fromHistory && navStateModal() === navToken){
      NAV.pending++;
      try { history.back(); } catch(e){}
      setTimeout(() => { NAV.pending = 0; }, 900);
    }
  };
  wrap.__closeNav = () => close(false);
  wrap.__closeFromHistory = () => close(true);
  $$('[data-close]', wrap).forEach(b => b.addEventListener('click', () => close(false)));
  const bd = $('.modal-backdrop', wrap);
  if (bd) bd.addEventListener('click', () => close(false));
  const sub = $('[data-submit]', wrap);
  if (sub) sub.addEventListener('click', () => { if (opts.onSubmit) opts.onSubmit(wrap, close); });
  const form = $('.modal-body', wrap);
  if (form) form.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT' && opts.enterSubmit !== false){
      e.preventDefault();
      if (sub) sub.click();
    }
  });
  requestAnimationFrame(() => wrap.classList.add('show'));
  setTimeout(() => {
    const first = $('input, select, textarea', wrap);
    if (first && window.innerWidth > 600) first.focus();
  }, 120);
  return { wrap, close };
}

function toast(msg){
  const t = $('#toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 1900);
}

function confirmModal(title, sub, label, onYes){
  openModal({
    title, sub,
    submitLabel: label,
    body: '',
    onSubmit: (wrap, close) => { close(); onYes(); }
  });
}

/* ---------- 거래처 자동완성 ---------- */
function normClientName(s){ return String(s == null ? '' : s).replace(/\s+/g, ' ').trim(); }
function clientByName(name){
  const k = normClientName(name).toLowerCase();
  if (!k) return null;
  return DB.clients.find(c => normClientName(c.name).toLowerCase() === k) || null;
}
/* 목록에 없는 거래처명을 직접 입력했을 때 거래처로 등록한다(같은 이름이 있으면 그 거래처를 쓴다) */
function ensureClient(name, memo){
  const nm = normClientName(name);
  if (!nm) return null;
  const found = clientByName(nm);
  if (found) return { client: found, created: false };
  const row = {
    id: uid(), name: nm, manager: '', phone: '', address: '',
    memo: memo || '', createdAt: new Date().toISOString()
  };
  DB.clients.push(row);
  syncClientRow(row);
  saveDB();
  return { client: row, created: true };
}

function mountClientPicker(wrap, s, opts){
  opts = opts || {};
  const input = $('#fClientInput', wrap);
  const list = $('#fAcList', wrap);
  const hidden = $('#fClient', wrap);
  const pickEl = $('#fClientPicked', wrap);
  const customWrap = $('#fCustomWrap', wrap);
  const customInput = $('[name=customPlace]', wrap);
  if (!input || !list || !hidden || !pickEl || !customWrap) return null;
  const curWorkerId = () => {
    if (opts.workerId) return opts.workerId;      /* 인력 선택 칸이 없는 창(출역 ON)은 미리 받는다 */
    const el = $('#fqWorker', wrap) || $('#fWorker', wrap);
    return el ? el.value : '';
  };
  const changed = cid => { try { if (opts.onChange) opts.onChange(cid || ''); } catch(e){} };

  let selId = '';
  if (s){
    const known = s.clientId && s.clientId !== '__custom' ? clientById(s.clientId) : null;
    if (s.clientId === '__custom' || (s.clientId && !known)){
      /* 직접 입력이거나, 거래처가 삭제된 기록 */
      selId = '__custom';
      input.value = s.place || '';
      if (customInput) customInput.value = s.place || '';
    } else if (s.clientId){
      selId = s.clientId;
      input.value = known.name;
    }
  }
  hidden.value = selId;

  function paint(){
    if (selId && selId !== '__custom'){
      const c = clientById(selId);
      pickEl.hidden = false;
      pickEl.classList.remove('custom');
      pickEl.textContent = '선택됨 · ' + (c ? c.name + (c.manager ? ' · ' + c.manager : '') : '거래처');
      customWrap.style.display = 'none';
    } else if (selId === '__custom'){
      pickEl.hidden = false;
      pickEl.classList.add('custom');
      pickEl.textContent = '새 거래처로 등록합니다';
      customWrap.style.display = '';
    } else {
      pickEl.hidden = true;
      pickEl.textContent = '';
      customWrap.style.display = 'none';
    }
  }
  function closeList(){
    list.hidden = true;
    list.innerHTML = '';
  }
  function openList(showAll){
    const raw = input.value.trim();
    const q = showAll ? '' : raw.toLowerCase();
    const freq = workerClientStats(curWorkerId());
    const rank = new Map(), cnt = new Map();
    freq.forEach((o, i) => { if (o.clientId){ rank.set(o.clientId, i); cnt.set(o.clientId, o.count); } });
    const found = sortClientsByFreq(DB.clients.filter(c => !q ||
      (c.name || '').toLowerCase().includes(q) ||
      (c.manager || '').toLowerCase().includes(q) ||
      (c.address || '').toLowerCase().includes(q) ||
      (c.phone || '').includes(q) ||
      (c.memo || '').toLowerCase().includes(q)
    ), curWorkerId()).slice(0, 8);

    let html = '';
    if (raw && !showAll) {
      html += '<button type="button" class="ac-item custom" data-cid="__custom"><b>직접 입력: "' + esc(raw) + '"</b>' +
        '<small>목록에 없으면 이 이름으로 새 거래처를 등록합니다</small></button>';
    }
    html += found.map(c => {
      const n = cnt.get(c.id) || 0;
      return '<button type="button" class="ac-item" data-cid="' + c.id + '"><b>' + esc(c.name) +
        (n ? ' <span class="badge cnt">' + n + '회</span>' : '') + '</b>' +
        '<small>' + esc([c.manager, c.address].filter(Boolean).join(' · ')) + '</small></button>';
    }).join('');
    if (!html) html = '<div class="ac-empty">일치하는 거래처가 없습니다</div>';
    list.innerHTML = html;
    list.hidden = false;
  }

  input.addEventListener('input', () => {
    selId = '';
    hidden.value = '';
    paint();
    openList();
  });
  input.addEventListener('focus', () => {
    /* 이미 고른 거래처가 있으면 전체 목록에서 다시 고를 수 있게 한다 */
    openList(!!selId && selId !== '__custom');
  });
  list.addEventListener('click', ev => {
    const b = ev.target.closest('.ac-item');
    if (!b) return;
    const cid = b.dataset.cid;
    selId = cid;
    hidden.value = cid;
    if (cid === '__custom'){
      const v = input.value.trim();
      input.value = v;
      if (customInput) customInput.value = v;
      paint();
      closeList();
      if (customInput) setTimeout(() => customInput.focus(), 0);
    } else {
      const c = clientById(cid);
      input.value = c ? c.name : '';
      paint();
      closeList();
      changed(cid);
    }
  });
  input.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && list && !list.hidden){
      ev.preventDefault();
      ev.stopPropagation();
      const first = $('.ac-item', list);
      if (first) first.click();
    } else if (ev.key === 'Escape'){
      closeList();
    }
  });
  wrap.addEventListener('click', ev => {
    if (!ev.target.closest('.ac')) closeList();
  });

  paint();

  /* 바깥(자주 가는 거래처 칩 등)에서 거래처를 골라 줄 수 있게 */
  return {
    select(cid){
      const c = clientById(cid);
      if (!c) return;
      selId = cid;
      hidden.value = cid;
      input.value = c.name;
      paint();
      closeList();
      changed(cid);
    },
    current(){ return selId; },
    refresh(){ openList(false); }
  };
}

  const startEl = $('#fStart', wrap);
  const endEl = $('#fEnd', wrap);
  const durEl = $('#fDur', wrap);
  const rateEl = $('#fRate', wrap);
  const wageEl = $('#fWage', wrap);
  const allowEl = $('#fAllow', wrap);
  const noteEl = $('#fCalcNote', wrap);
  const hintEl = $('#fDurHint', wrap);

  let durMin = dur0 > 0 ? dur0 : 540;
  let wageManual = false;

  if (durEl){
    const has = Array.from(durEl.options).some(o => o.value === String(durMin));
    durEl.value = has ? String(durMin) : '';
  }

  function currentHours(){
    return hoursOf({ start: startEl.value, end: endEl.value });
  }
  function currentAllowance(){
    return Math.max(0, Math.round(Number(allowEl && allowEl.value) || 0));
  }
  function calcWage(){
    return Math.round(currentHours() * num(rateEl.value)) + currentAllowance();
  }
  function paintDurChips(){
    $$('.dur-chip', wrap).forEach(b => b.classList.toggle('on', Number(b.dataset.min) === durMin));
    if (hintEl) hintEl.textContent = '현재 ' + currentHours() + '시간';
  }
  function paintNote(){
    const h = currentHours();
    const r = num(rateEl.value);
    const al = currentAllowance();
    const calc = calcWage();
    const manual = !!(wageEl && Number(wageEl.value) !== calc);
    if (noteEl) noteEl.innerHTML = '<b>' + h + '시간</b> × <b>' + won(r) + '</b>' +
      (al ? ' + 수당 <b>' + won(al) + '</b>' : '') + ' = <b>' + won(calc) + '</b>' +
      (manual ? ' · 급여를 직접 입력했습니다(' + won(wageEl.value) + ')' : ' · 자동 계산 (급여는 직접 수정할 수 있습니다)');
    $$('.allow-chip', wrap).forEach(b => b.classList.toggle('on', Number(b.dataset.allow) === al));
  }
  function applyWage(){
    if (!wageManual && wageEl){
      wageEl.value = calcWage();
    }
    paintNote();
    paintDurChips();
  }
  function setEndFromStart(){
    const base = timeMin(startEl.value || '08:00');
    endEl.value = minToTime(base + durMin);
  }
  function syncDurFromEnd(){
    durMin = Math.round(currentHours() * 60);
    const val = String(durMin);
    const has = Array.from(durEl.options).some(o => o.value === val);
    durEl.value = has ? val : '';
  }

  startEl.addEventListener('input', () => { setEndFromStart(); wageManual = false; applyWage(); });
  startEl.addEventListener('change', () => { setEndFromStart(); wageManual = false; applyWage(); });
  endEl.addEventListener('input', () => { syncDurFromEnd(); wageManual = false; applyWage(); });
  endEl.addEventListener('change', () => { syncDurFromEnd(); wageManual = false; applyWage(); });
  rateEl.addEventListener('input', () => { wageManual = false; applyWage(); });
  if (wageEl) wageEl.addEventListener('input', () => { wageManual = true; paintNote(); });
  if (allowEl){
    allowEl.addEventListener('input', () => { wageManual = false; applyWage(); });
    allowEl.addEventListener('change', () => { wageManual = false; applyWage(); });
  }
  $$('.allow-chip', wrap).forEach(b => b.addEventListener('click', () => {
    if (allowEl) allowEl.value = b.dataset.allow || '0';
    wageManual = false;
    applyWage();
  }));
  durEl.addEventListener('change', () => {
    if (!durEl.value){ paintNote(); return; }
    durMin = Number(durEl.value);
    setEndFromStart();
    wageManual = false;
    applyWage();
  });
  $$('.dur-chip', wrap).forEach(b => b.addEventListener('click', () => {
    durMin = Number(b.dataset.min);
    durEl.value = String(durMin);
    setEndFromStart();
    wageManual = false;
    applyWage();
  }));

  const fWorker = $('#fWorker', wrap);
  if (fWorker) fWorker.addEventListener('change', () => {
    const w = workerById(fWorker.value);
    if (w && rateEl && num(w.rate) > 0){
      rateEl.value = num(w.rate);
      wageManual = false;
      applyWage();
    }
  });

  mountClientPicker(wrap, s);
  paintNote();
  paintDurChips();
}

/* ============================================================
   출근 체크 — ON/OFF 와 따로, '오늘 왔는지'만 남긴다.
   · 기록은 인력 한 명에 하루치만 둔다 (attendDay = 오늘 기준일, attendAt = 누른 시각, attendBy = 누른 관리자)
   · 기준일은 '오늘 출역'과 같이 낮 12시에 바뀌므로, 날이 바뀌면 저절로 미출근 상태가 된다
   · DB(wf_workers) 의 attend_day · attend_at · attend_by 칸으로 관리자 3명 기기에 함께 반영된다
   ============================================================ */
function attendInfoOf(w, day, rows){
  if (!w) return null;
  const today = day || dispatchDateKey();
  if (String(w.attendDay || '') === today){
    return { at: w.attendAt || '', by: w.attendBy || '', auto: false };
  }
  /* 출근 버튼이 생기기 전에 켠 ON 건도 근무중이면 출근으로 본다 */
  const open = (rows || todayRows(w.id)).filter(isOpenShift)[0];
  if (open) return { at: open.onAt || '', by: open.createdBy || '', auto: true };
  return null;
}
function markAttend(w, when, silent){
  if (!w) return '';
  const now = (when instanceof Date && !isNaN(when)) ? when : new Date();
  const day = dispatchDateKey(now);
  w.attendDay = day;
  w.attendAt = now.toISOString();
  w.attendBy = curAdmin().id;
  saveDB();
  syncWorker(w);
  if (!silent){
    render();
    toast(w.name + ' 님 출근 완료 · ' + hmOf(now));
  }
  return day;
}
function clearAttend(w, silent){
  if (!w) return;
  w.attendDay = '';
  w.attendAt = null;
  w.attendBy = '';
  saveDB();
  syncWorker(w);
  if (!silent){
    render();
    toast(w.name + ' 님 출근을 해제했습니다');
  }
}
function toggleAttend(workerId){
  const w = workerById(workerId);
  if (!w) return;
  const today = dispatchDateKey();
  if (String(w.attendDay || '') === today){
    if (openRowsOf(w.id).length){
      toast(w.name + ' 님은 ON(근무중)이라 출근이 유지됩니다 · OFF 후 해제할 수 있습니다');
      return;
    }
    clearAttend(w);
    return;
  }
  markAttend(w);
}

/* ============================================================
   오늘 출역 체크 · 근무시간 바로 등록/수정
   ON/OFF 를 누른 순간의 현재 시각을 그대로 기록한다.
   · OFF → ON  : 지금 시각을 시작으로 새 출역 건을 만든다 (하루에 몇 번이든 반복 가능)
   · ON → OFF : 진행 중(종료 없음)인 건에만 지금 시각을 종료로 넣는다
   ============================================================ */
function todayRows(workerId){
  const today = dispatchDateKey();
  return DB.shifts.filter(s => s.workerId === workerId && s.date === today);
}
function openRowsOf(workerId){
  return todayRows(workerId).filter(s => isOpenShift(s));
}
function toggleTodayShift(workerId){
  const w = workerById(workerId);
  if (!w) return;
  const open = openRowsOf(workerId);
  if (open.length) return endShiftNow(w, open);
  return askStartShift(w);
}

/* OFF → ON: 바로 켜지 않고 확인창을 먼저 띄운다.
   · 시작 시간 : 지금 시각이 미리 채워져 있고, 필요하면 고쳐서 켤 수 있다
   · 거래처 : 자주 가는 거래처 칩이나 검색으로 고를 수 있고, 비워 두어도 된다
   · 확인 : 고른 시작 시각·거래처로 새 건을 만든다
   · 취소 : 아무것도 바꾸지 않는다 */
function askStartShift(w){
  const timeId = 'onAskTime';
  const inputId = 'onAskInput';
  const shown = hmOf(new Date());
  const m = openModal({
    title: '출역 ON',
    sub: '시작 시간 · 거래처 (둘 다 그대로 두어도 됩니다)',
    body:
      '<div class="on-ask">' +
        '<p class="on-ask-msg"><b>' + esc(w.name) + '</b> 님 출역 ON — 시작 시간을 확인하고, 거래처가 있으면 골라 주세요. (지금 <b id="' + timeId + '">' + shown + '</b>)</p>' +
        '<label class="f on-ask-f"><span>시작 시간</span>' +
          '<input type="time" id="' + inputId + '" step="60" value="' + shown + '"></label>' +
        '<div id="onAskFreq"></div>' +
        '<label class="f"><span>거래처 <em>선택 · 비워 두어도 됩니다</em></span>' +
          '<div class="ac" id="fAcBox">' +
            '<input type="text" id="fClientInput" autocomplete="off" placeholder="거래처명 · 담당자 · 주소로 검색">' +
            '<div class="ac-list" id="fAcList" hidden></div>' +
          '</div>' +
        '</label>' +
        '<div class="ac-pick" id="fClientPicked" hidden></div>' +
        '<input type="hidden" id="fClient" value="">' +
        '<label class="f" id="fCustomWrap" style="display:none"><span>장소 직접 입력</span>' +
          '<input type="text" name="customPlace" value="" placeholder="예: 표선 공사현장"></label>' +
        '<p class="form-note">그대로 확인하면 지금 시각으로 켜집니다. 시작 시간을 고쳐서 켜도 되고, 목록에 없는 거래처는 이름을 적으면 새 거래처로 함께 등록됩니다. OFF를 누를 때까지 근무중으로 남고, 취소하면 아무것도 바뀌지 않습니다.</p>' +
      '</div>',
    submitLabel: '확인',
    onSubmit: (wrap, close) => {
      const inp = wrap ? wrap.querySelector('#' + inputId) : null;
      /* 손대지 않았으면 확인을 누른 순간의 시각 — 창을 오래 열어 두어도 정확하다 */
      const when = (inp && inp.dataset.touched) ? onAskWhen(inp.value) : null;
      const client = onAskClient(wrap);
      close();
      return startShiftNow(w, when || new Date(), client);
    }
  });
  /* 거래처 : 자주 가는 거래처 칩 · 검색 선택 · 직접 입력 */
  const freqEl = (m && m.wrap) ? m.wrap.querySelector('#onAskFreq') : null;
  let picker = null;
  function paintFreq(){
    if (!freqEl) return;
    freqEl.innerHTML = freqChipsHTML(w.id, picker ? picker.current() : '');
    $$('[data-freq]', freqEl).forEach(b => b.addEventListener('click', () => {
      if (picker) picker.select(b.dataset.freq);
    }));
  }
  try { picker = mountClientPicker(m.wrap, null, { workerId: w.id, onChange: () => paintFreq() }); } catch(e){ picker = null; }
  paintFreq();

  /* 창을 열어 둔 사이에도, 손대지 않은 입력값은 실제 시각을 따라가게 한다 */
  const inp0 = m && m.wrap ? m.wrap.querySelector('#' + inputId) : null;
  if (inp0){
    /* 직접 고른 시각은 그대로 둔다 (자동으로 따라가지 않게) */
    ['input', 'change'].forEach(ev => inp0.addEventListener(ev, () => { inp0.dataset.touched = '1'; }));
  }
  const tick = setInterval(() => {
    if (!m || !m.wrap || !m.wrap.isConnected){ clearInterval(tick); return; }
    const live = document.getElementById(timeId);
    if (live) live.textContent = hmOf(new Date());
    const inp = m.wrap.querySelector('#' + inputId);
    if (inp && !inp.dataset.touched) inp.value = hmOf(new Date());
  }, 1000);
  return m;
}

/* 확인창에서 고른 거래처 → 기록에 넣을 clientId · place.
   고르지 않고 비워 두면 둘 다 빈 값 (거래처 없는 출역). */
function onAskClient(wrap){
  const none = { clientId: '', place: '', created: false };
  if (!wrap) return none;
  const hid = wrap.querySelector('#fClient');
  const typed = wrap.querySelector('#fClientInput');
  const custom = wrap.querySelector('[name=customPlace]');
  const typedName = normClientName(typed ? typed.value : '');
  const directName = normClientName(custom ? custom.value : '') || typedName;
  let cid = hid ? String(hid.value || '') : '';
  if (cid === '__custom' || (!cid && directName)){
    if (!directName) return none;
    const got = ensureClient(directName);
    if (!got) return none;
    return { clientId: got.client.id, place: got.client.name, created: !!got.created };
  }
  if (cid){
    const c = clientById(cid) || (typedName ? clientByName(typedName) : null);
    if (c) return { clientId: c.id, place: c.name, created: false };
  }
  /* 목록에서 고르지 않았는데 이름만 적어 둔 경우도 새 거래처로 등록 */
  if (directName){
    const got = ensureClient(directName);
    if (got) return { clientId: got.client.id, place: got.client.name, created: !!got.created };
  }
  return none;
}

/* 확인창에서 고른 시작 시각(HH:MM) → 실제 시각.
   시계는 '지금과 가장 가까운 그 시각'으로 잡아 자정을 넘긴 선택도 자연스럽게 맞춘다. */
function onAskWhen(val){
  const p = /^([01]?\d|2[0-3]):([0-5]\d)$/.exec(String(val || '').trim());
  if (!p) return null;
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate(), Number(p[1]), Number(p[2]), 0, 0);
  if (isNaN(d.getTime())) return null;
  const half = 12 * 60 * 60 * 1000;
  if (d.getTime() - now.getTime() > half) d.setDate(d.getDate() - 1);
  else if (now.getTime() - d.getTime() > half) d.setDate(d.getDate() + 1);
  return d;
}

/* OFF → ON: 고른 시작 시각으로 새 건 (when 을 주면 그 시각, client 를 주면 거래처도 함께) */
function startShiftNow(w, when, client){
  const now = (when instanceof Date && !isNaN(when)) ? when : new Date();
  const rec = {
    id: uid(),
    createdBy: curAdmin().id,
    createdAt: now.toISOString(),
    workerId: w.id,
    workerName: w.name,
    clientId: (client && client.clientId) || '',
    place: (client && client.place) || '',
    date: dispatchDateKey(now),
    start: hmOf(now),
    end: '',
    hours: 0,
    rate: num(w.rate) > 0 ? num(w.rate) : RATE,
    wage: 0,
    breakH: 0,
    memo: '',
    clientPaid: false,
    workerPaid: false,
    onAt: now.toISOString(),
    offAt: null
  };
  closeStaleOpen(w, rec.date);
  /* ON 을 누르면 출근도 함께 체크한다 (이미 출근이면 그대로) */
  const wasAttended = String(w.attendDay || '') === rec.date;
  if (!wasAttended) markAttend(w, now, true);
  DB.shifts.push(rec);
  saveDB();
  syncShift(rec);
  render();
  const mine = DB.shifts.filter(s => s.workerId === w.id && s.date === rec.date);
  toast(w.name + ' 님 ' + (mine.length > 1 ? mine.length + '차 ' : '') + 'ON ' + rec.start + ' 기록' +
    (rec.place ? ' · ' + rec.place : '') +
    (wasAttended ? '' : ' · 출근도 함께 체크했습니다'));
  return rec;
}

/* 어제 이전에 켜 둔 채 끝나지 않은 건은 0시간으로 마감해 둔다 */
function closeStaleOpen(w, today){
  const stale = DB.shifts.filter(s => s.workerId === w.id && isOpenShift(s) && s.date !== today);
  if (!stale.length) return 0;
  stale.forEach(s => {
    s.end = s.start || '00:00';
    s.hours = 0;
    s.wage = 0;
    syncShift(s);
  });
  return stale.length;
}

/* ON → OFF: 진행 중인 건에 지금 시각을 종료로 */
function endShiftNow(w, open){
  const now = new Date();
  const endHM = hmOf(now);
  open.forEach(s => {
    s.end = endHM;
    s.offAt = now.toISOString();
    s.hours = hoursOf(s);
    s.wage = Math.round(s.hours * num(s.rate || RATE));
    s.updatedBy = curAdmin().id;
    s.updatedAt = now.toISOString();
    syncShift(s);
  });
  saveDB();
  render();
  const last = open[open.length - 1];
  const mins = last ? Math.round(num(last.hours) * 60) : 0;
  if (!last) return;
  if (mins <= 0){
    toast(w.name + ' 님 OFF ' + endHM + ' · 같은 시각이라 0시간입니다 · 시간을 골라 주세요');
    openQuickShift({ id: last.id });
    return;
  }
  toast(w.name + ' 님 OFF ' + endHM + ' · ' + durLabel(mins) + ' · 일당 ' + won(last.wage));
  return last;
}

/* 오늘 날짜로 인력·시간·거래처만 골라 바로 저장하는 빠른 입력창 (기존 기록이면 시간 수정)
   근무시간은 1~6시간 단축 버튼이나 숫자 입력으로 정하고, 시작·종료 시간은 자동으로 맞춰진다. */
function openQuickShift(opts){
  opts = opts || {};
  const existing = opts.id ? DB.shifts.find(x => x.id === opts.id) : null;
  if (!DB.workers.length){
    toast('먼저 인력을 등록해 주세요');
    ui.tab = 'workers'; render();
    return;
  }
  const today = dispatchDateKey();
  const day = existing ? (existing.date || today) : today;
  const ordered = DB.workers.filter(w => w.status !== RESERVE).concat(DB.workers.filter(w => w.status === RESERVE));
  const w0 = (existing && workerById(existing.workerId)) || workerById(opts.workerId) || ordered[0] || DB.workers[0];
  const rate0 = existing && num(existing.rate) > 0 ? num(existing.rate) : (num(w0.rate) > 0 ? num(w0.rate) : RATE);
  const start0 = (existing && existing.start) || opts.start || '08:00';
  const isOpen = !!existing && isOpenShift(existing);
  const elapsed = isOpen ? Math.max(10, Math.round(openMinutes(existing) / 10) * 10) : 0;
  const curMin = (existing && existing.end) ? Math.round(hoursOf(existing) * 60) : 0;
  const dur0 = existing
    ? (curMin > 0 ? curMin : (elapsed > 0 ? elapsed : 480))
    : (num(opts.durMin) > 0 ? num(opts.durMin) : 480);
  const end0 = (curMin > 0 && existing.end) ? existing.end : minToTime(timeMin(start0) + dur0);
  const h0 = Math.round((dur0 || 480) / 6) / 10;   /* 분 → 시간 (소수 1자리) */

  const workerOpts = ordered.map(w =>
    '<option value="' + w.id + '"' + (w.id === w0.id ? ' selected' : '') + '>' +
      esc(w.name) + (ageGroupKey(w) ? ' · ' + esc(ageGroupKey(w)) : '') + ' · ' + esc(w.status) + ' · 시급 ' + won(w.rate || RATE) + '</option>').join('');

  const body =
    '<p class="form-note" style="font-weight:800;color:#1c43c9">' + esc(fmtDate(day)) + ' 근무를 바로 기록합니다</p>' +
    (isOpen ? '<p class="form-note">지금 <b>근무중</b> · ON ' + esc(onHM(existing)) + ' · ' + elapsedLabel(openMinutes(existing)) +
      ' 경과 · 시간을 골라 저장하면 이 건이 마감됩니다</p>' : '') +
    '<label class="f"><span>인력</span><select name="workerId" id="fqWorker">' + workerOpts + '</select></label>' +
    '<div class="dur-chips" role="group" aria-label="근무시간 빠른 선택">' +
      [1,2,3,4,5,6].map(h => '<button type="button" class="dur-chip" data-min="' + (h * 60) + '" data-hours="' + h + '" aria-label="' + h + '시간">' + h + '시간</button>').join('') +
    '</div>' +
    '<label class="f"><span>근무시간 직접 입력 (시간)</span>' +
      '<input type="number" id="fqHours" inputmode="decimal" min="0.5" max="16" step="0.5" value="' + h0 + '"></label>' +
    '<label class="f"><span>추가 수당(원)</span><input type="number" name="allowance" id="fqAllow" step="10000" min="0" value="' + (existing ? allowanceOf(existing) : 0) + '"></label>' +
    '<div class="allow-chips" role="group" aria-label="추가 수당 빠른 선택">' +
      [[0,'없음'],[10000,'1만'],[20000,'2만'],[30000,'3만'],[50000,'5만']].map(p =>
        '<button type="button" class="allow-chip" data-allow="' + p[0] + '">' + p[1] + '</button>').join('') +
    '</div>' +
    '<p class="form-note" id="fqCalc"></p>' +
    '<div class="row2">' +

    (existing && existing.clientPaid ? '<input type="checkbox" id="fClientPaid" checked hidden>' : '') +
    (existing && existing.workerPaid ? '<input type="checkbox" id="fWorkerPaid" checked hidden>' : '');

  const m = openModal({
    title: existing ? (isOpen ? '오늘 근무 마감 (거래처·시간)' : '오늘 근무시간 수정') : '오늘 근무시간 등록',
    sub: fmtDate(day) + ' · 시간만 골라도 일당이 계산됩니다',
    body,
    submitLabel: existing ? '수정 저장' : '등록',
    onSubmit: (wrap, close) => submitShift(wrap, close, existing)
  });

  const wrap = m.wrap;
  const sEl = $('#fqStart', wrap), eEl = $('#fqEnd', wrap), hEl = $('#fqHours', wrap);
  const rEl = $('#fqRate', wrap), gEl = $('#fqWage', wrap), cEl = $('#fqCalc', wrap);
  const alEl = $('#fqAllow', wrap);
  let durMin = dur0 > 0 ? dur0 : 480;
  const curHours = () => hoursOf({ start: sEl.value, end: eEl.value });
  const curAllow = () => Math.max(0, Math.round(Number(alEl && alEl.value) || 0));

  function paintCalc(){
    const h = durMin / 60;
    const rate = num(rEl.value);
    const al = curAllow();
    const pay = Math.round(h * rate) + al;
    if (gEl) gEl.value = pay;
    if (cEl) cEl.innerHTML = '일당 <b>' + h + '시간</b> × <b>' + won(rate) + '</b>' +
      (al ? ' + 수당 <b>' + won(al) + '</b>' : '') + ' = <b>' + won(pay) + '</b>';
    $$('.dur-chip', wrap).forEach(b => b.classList.toggle('on', Number(b.dataset.min) === Math.round(durMin)));
    $$('.allow-chip', wrap).forEach(b => b.classList.toggle('on', Number(b.dataset.allow) === al));
  }
  function setEnd(){ eEl.value = minToTime(timeMin(sEl.value || '08:00') + durMin); }
  function setHours(h){
    const v = Math.max(0, Math.min(24, Number(h) || 0));
    durMin = Math.round(v * 60);
    setEnd();
    paintCalc();
  }
  if (hEl){
    hEl.addEventListener('input', () => setHours(hEl.value));
    hEl.addEventListener('change', () => { setHours(hEl.value); hEl.value = Math.round(durMin / 6) / 10; });
  }
  $$('.dur-chip', wrap).forEach(b => b.addEventListener('click', () => {
    durMin = Number(b.dataset.min);
    if (hEl) hEl.value = Number(b.dataset.hours) || (durMin / 60);
    setEnd();
    paintCalc();
  }));
  if (alEl){
    alEl.addEventListener('input', paintCalc);
    alEl.addEventListener('change', paintCalc);
  }
  $$('.allow-chip', wrap).forEach(b => b.addEventListener('click', () => {
    if (alEl) alEl.value = b.dataset.allow || '0';
    paintCalc();
  }));
  sEl.addEventListener('input', () => { setEnd(); paintCalc(); });
  sEl.addEventListener('change', () => { setEnd(); paintCalc(); });
  eEl.addEventListener('input', () => {
    durMin = Math.round(curHours() * 60);
    if (hEl) hEl.value = Math.round(durMin / 6) / 10;
    paintCalc();
  });
  eEl.addEventListener('change', () => {
    durMin = Math.round(curHours() * 60);
    if (hEl) hEl.value = Math.round(durMin / 6) / 10;
    paintCalc();
  });
  const freqEl = $('#fqFreq', wrap);
  let picker = null;
  function paintFreq(){
    if (!freqEl) return;
    const wid = wSel ? wSel.value : (existing ? existing.workerId : '');
    freqEl.innerHTML = freqChipsHTML(wid, picker ? picker.current() : '');
    $$('[data-freq]', freqEl).forEach(b => b.addEventListener('click', () => {
      if (picker) picker.select(b.dataset.freq);
    }));
  }
  const wSel = $('#fqWorker', wrap);
  if (wSel) wSel.addEventListener('change', () => {
    const w = workerById(wSel.value);
    if (w && num(w.rate) > 0 && rEl){ rEl.value = num(w.rate); paintCalc(); }
    paintFreq();
  });  picker = mountClientPicker(wrap, existing, { onChange: () => paintFreq() });
  paintFreq();
  paintCalc();
}

/* ============================================================
   계좌 문자 보내기 — 근무·청구 금액·입금 계좌를 거래처에 문자로
   ============================================================ */
const ACCOUNT_KEY = 'wfp_account';

function billingAccount(){
  try {
    const raw = localStorage.getItem(ACCOUNT_KEY);
    if (raw){
      const o = JSON.parse(raw) || {};
      return { bank: String(o.bank || ''), number: String(o.number || ''), holder: String(o.holder || '') };
    }
  } catch(e){}
  return { bank: '', number: '', holder: '' };
}
function saveBillingAccount(o){
  const v = {
    bank: normClientName(o && o.bank),
    number: normClientName(o && o.number),
    holder: normClientName(o && o.holder)
  };
  try { localStorage.setItem(ACCOUNT_KEY, JSON.stringify(v)); } catch(e){}
  return v;
}
function accountLine(acc){
  const a = acc || billingAccount();
  if (!a.number) return '계좌 미등록 (아래에서 입력해 저장하세요)';
  return [a.bank, a.number, a.holder ? '(' + a.holder + ')' : ''].filter(Boolean).join(' ');
}
function billingShifts(ids){
  return String(ids || '').split(',').map(x => x.trim()).filter(Boolean)
    .map(x => DB.shifts.find(s => s.id === x)).filter(Boolean);
}
/* 근무 청구 문자: 날짜 · 인력별 시간/기본 금액 · 합계 · 입금 계좌만 간결하게
   (거래처명 제외 · 추가 수당 제외: 문자에는 시간 × 시급인 기본 근무 금액만 적는다) */
function billingMessageText(list, acc){
  const rows = Array.isArray(list) ? list : [list];
  if (!rows.length) return '';
  const s0 = rows[0];
  const dateISO = s0.date || todayISO();
  const hours = rows.reduce((a, s) => a + hoursOf(s), 0);
  const sum = rows.reduce((a, s) => a + basePayOf(s), 0);
  const lines = [dateISO];
  rows.forEach(s => {
    lines.push(wName(s) + ' ' + hoursLabel(s) + ' · ' + won(basePayOf(s)));
  });
  if (rows.length > 1) lines.push('합계 ' + hours + '시간 · ' + won(sum));
  lines.push('입금 계좌: ' + accountLine(acc));
  return lines.join('\n');
}
function smsHref(phone, text){
  const num = String(phone || '').replace(/[^\d+]/g, '');
  const isIOS = typeof navigator !== 'undefined' && /iPad|iPhone|iPod/.test(navigator.userAgent || '');
  return 'sms:' + num + (isIOS ? '&' : '?') + 'body=' + encodeURIComponent(String(text || ''));
}
function openDeviceSms(phone, text){
  const url = smsHref(phone, text);
  try {
    const a = document.createElement('a');
    a.href = url;
    a.rel = 'noopener';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { try { a.remove(); } catch(e){} }, 0);
  } catch(e){
    try { window.location.href = url; } catch(e2){}
  }
  return url;
}
function recordBillingSms(list, phone, text){
  const rows = Array.isArray(list) ? list : [list];
  if (!rows.length) return null;
  const s0 = rows[0];
  const client = clientById(s0.clientId) || clientByName(s0.place);
  const rec = {
    id: uid(),
    at: new Date().toISOString(),
    managerId: curAdmin().id,
    mode: 'client',
    recipients: [client ? client.name : (s0.place || formatPhone(normPhone(phone)) || '거래처')],
    count: 1,
    content: String(text || '')
  };
  DB.messages.push(rec);
  rows.forEach(s => { s.billSmsAt = rec.at; syncShift(s); });
  syncSms(rec);
  saveDB();
  return rec;
}

        const line = '입금 계좌: ' + accountLine(acc2);
        if (i >= 0) lines[i] = line; else lines.push(line);
        ta.value = lines.join('\n');
      }
      if (noteEl) noteEl.textContent = '계좌를 저장했습니다 · 다음부터 자동으로 들어갑니다';

      copyText(text);
      if (noteEl) noteEl.textContent = '문구를 복사했습니다 · 문자 앱에 붙여넣으세요';
      toast('문구를 복사했습니다');

      if (!String(text).trim()){ toast('보낼 내용을 입력해 주세요'); return; }
      recordBillingSms(list, $('#billPhone', wrap).value, text);
      logged = true;
      if (noteEl) noteEl.textContent = '발송 이력에 기록했습니다 (문자 앱은 열지 않았습니다)';

      render();
    }

function copyText(text){
  const t = String(text == null ? '' : text);
  try {
    if (navigator && navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).catch(() => {});
      return true;
    }
  } catch(e){}
  try {
    const ta = document.createElement('textarea');
    ta.value = t;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    return true;
  } catch(e){ return false; }
}

function hasCheck(wrap, id){
  const el = $('#' + id, wrap);
  return !!(el && el.checked);
}
function syncPay(rec, key, want, me){
  const dateKey = key === 'clientPaid' ? 'clientPaidDate' : 'workerPaidDate';
  const byKey = key === 'clientPaid' ? 'clientPaidBy' : 'workerPaidBy';
  if (want){
    rec[key] = true;
    if (!rec[dateKey]) rec[dateKey] = todayISO();
    if (!rec[byKey]) rec[byKey] = me.id;
  } else {
    rec[key] = false;
    rec[dateKey] = null;
    rec[byKey] = null;
  }
  rec.updatedBy = me.id;
  rec.updatedAt = new Date().toISOString();
}

function submitShift(wrap, close, existing){
  const g = n => { const el = $('[name=' + n + ']', wrap); return el ? el.value : ''; };
  const workerId = g('workerId');
  const date = g('date');
  const start = g('start');
  const end = g('end');
  const rate = Number(g('rate') || 0);
  const wage = Number(g('wage') || 0);
  const clientId = g('clientId');
  const memo = String(g('memo')).trim();
  const allowance = Math.max(0, Math.round(Number(g('allowance') || 0)));
  const allowanceMemo = String(g('allowanceMemo')).trim();
  const cPaid = hasCheck(wrap, 'fClientPaid');
  const wPaid = hasCheck(wrap, 'fWorkerPaid');

  const w = workerById(workerId);
  if (!w){ toast('인력을 선택해 주세요'); return; }
  if (!date){ toast('근무일을 입력해 주세요'); return; }
  if (!start || !end){ toast('근무 시간을 입력해 주세요'); return; }
  const hours = hoursOf({ start, end });
  if (!(hours > 0)){ toast('근무 시간을 확인해 주세요 (시작과 종료가 같습니다)'); return; }
  if (hours > 16){ toast('16시간을 넘는 근무는 등록할 수 없습니다'); return; }
  if (!(rate > 0)){ toast('시급을 입력해 주세요'); return; }
  if (!(wage > 0)){ toast('급여를 입력해 주세요'); return; }

  /* 목록에 없는 거래처명을 직접 입력해도 저장한다.
     같은 이름의 거래처가 있으면 그 거래처에, 없으면 새 거래처를 만들어 기록에 연결한다. */
  const typedEl = $('#fClientInput', wrap);
  const typedName = normClientName(typedEl ? typedEl.value : '');
  const directName = normClientName(g('customPlace')) || typedName;
  let cid = clientId;
  let place = '';
  let newClientName = '';
  if (clientId === '__custom' || (!clientId && directName)){
    if (!directName){ toast('거래처 이름을 입력해 주세요'); return; }
    const got = ensureClient(directName);
    if (!got){ toast('거래처 이름을 입력해 주세요'); return; }
    cid = got.client.id;
    place = got.client.name;
    if (got.created) newClientName = got.client.name;
  } else if (clientId){
    const c = clientById(clientId) || clientByName(typedName);
    if (!c){ toast('거래처를 다시 선택해 주세요'); return; }
    cid = c.id;
    place = c.name;
  } else {
    toast('거래처를 검색해 선택하거나 이름을 직접 입력해 주세요');
    return;
  }

  const me = curAdmin();
  let rec;
  if (existing){
    rec = existing;
    rec.updatedBy = me.id;
    rec.updatedAt = new Date().toISOString();
  } else {
    rec = { id: uid(), createdBy: me.id, createdAt: new Date().toISOString() };
    DB.shifts.push(rec);
  }
  rec.workerId = w.id;
  rec.workerName = w.name;
  rec.clientId = cid;
  rec.place = place;
  rec.date = date;
  rec.start = start;
  rec.end = end;
  rec.hours = hours;
  rec.rate = rate;
  rec.wage = wage;
  rec.allowance = allowance;
  rec.allowanceMemo = allowanceMemo;
  rec.breakH = 0;
  rec.memo = memo;
  syncPay(rec, 'clientPaid', cPaid, me);
  syncPay(rec, 'workerPaid', wPaid, me);

  saveDB();
  syncShift(rec);
  close();
  render();
  const done = existing ? '근무 기록을 수정했습니다' : w.name + ' 님 근무를 등록했습니다';
  toast(newClientName ? done + ' · 새 거래처 "' + newClientName + '" 등록' : done);
}

/* ============================================================
   연락처 파일 가져오기 (.vcf / .csv / .txt)
   ============================================================ */
function decodeContactBytes(data){
  if (typeof data === 'string') return data;
  let bytes;
  if (data instanceof ArrayBuffer) bytes = new Uint8Array(data);
  /* 다른 영역(iframe·테스트 환경)에서 온 ArrayBuffer 도 받아들인다 */
  else if (data && typeof data.byteLength === 'number' && data.buffer === undefined) bytes = new Uint8Array(data);
  else if (data && data.buffer) bytes = new Uint8Array(data.buffer, data.byteOffset || 0, data.byteLength || data.buffer.byteLength);
  else return String(data == null ? '' : data);

  if (typeof TextDecoder !== 'undefined'){
    try { return new TextDecoder('utf-8', { fatal: true }).decode(bytes); } catch (e){}
    try { return new TextDecoder('euc-kr').decode(bytes); } catch (e){}
  }
  return utf8Decode(bytes);
}
function utf8Decode(bytes){
  let out = '', i = 0;
  if (bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) i = 3;
  while (i < bytes.length){
    const b = bytes[i++];
    if (b < 0x80){ out += String.fromCharCode(b); continue; }
    let need = 0, cp = 0;
    if ((b & 0xE0) === 0xC0){ need = 1; cp = b & 0x1F; }
    else if ((b & 0xF0) === 0xE0){ need = 2; cp = b & 0x0F; }
    else if ((b & 0xF8) === 0xF0){ need = 3; cp = b & 0x07; }
    else { out += '\uFFFD'; continue; }
    if (i + need > bytes.length){ out += '\uFFFD'; break; }
    let ok = true;
    for (let k = 0; k < need; k++){
      const cc = bytes[i + k];
      if ((cc & 0xC0) !== 0x80){ ok = false; break; }
      cp = (cp << 6) | (cc & 0x3F);
    }
    if (!ok){ out += '\uFFFD'; continue; }
    i += need;
    out += String.fromCodePoint(cp);
  }
  return out;
}
function readContactFile(file){
  return new Promise((resolve, reject) => {
    if (!file) return resolve('');
    if (typeof file.arrayBuffer === 'function'){
      file.arrayBuffer().then(buf => resolve(decodeContactBytes(buf))).catch(reject);
      return;
    }
    if (typeof FileReader === 'undefined'){
      if (typeof file.text === 'function'){
        file.text().then(txt => resolve(String(txt || ''))).catch(() => resolve(''));
        return;
      }
      return resolve('');
    }
    const fr = new FileReader();
    fr.onload = () => resolve(decodeContactBytes(fr.result));
    fr.onerror = () => reject(fr.error || new Error('read error'));
    fr.readAsArrayBuffer(file);
  });
}

/* 전화번호 정규화 · 표시 */
function normPhone(p){
  let d = String(p == null ? '' : p).replace(/[^\d]/g, '');
  if (!d) return '';
  if (d.indexOf('0082') === 0) d = d.slice(4);
  else if (d.indexOf('82') === 0 && d.length >= 11) d = d.slice(2);
  if (/^0\d{8,10}$/.test(d)) return d;
  if (/^(10|1[1-9]|2)\d{7,8}$/.test(d)) return '0' + d;
  return d;
}
function formatPhone(d){
  const n = String(d || '').replace(/[^\d]/g, '');
  if (!n) return '';
  if (/^01\d/.test(n)){
    if (n.length === 11) return n.slice(0, 3) + '-' + n.slice(3, 7) + '-' + n.slice(7);
    if (n.length === 10) return n.slice(0, 3) + '-' + n.slice(3, 6) + '-' + n.slice(6);
    return n;
  }
  if (n.indexOf('02') === 0){
    if (n.length === 10) return '02-' + n.slice(2, 6) + '-' + n.slice(6);
    if (n.length === 9) return '02-' + n.slice(2, 5) + '-' + n.slice(5);
  }
  if (n.length === 11) return n.slice(0, 3) + '-' + n.slice(3, 7) + '-' + n.slice(7);
  if (n.length === 10) return n.slice(0, 3) + '-' + n.slice(3, 6) + '-' + n.slice(6);
  if (n.length === 8) return n.slice(0, 4) + '-' + n.slice(4);
  return n;
}
function vcardUnescape(s){
  return String(s == null ? '' : s)
    .replace(/\\n/gi, '\n')
    .replace(/\\,/g, ',')
    .replace(/\\;/g, ';')
    .replace(/\\\\/g, '\\')
    .trim();
}
function vcardClean(s){
  return String(s == null ? '' : s)
    .replace(/\u0000/g, '')
    .replace(/[\r\n\t]+/g, ' ')
    .replace(/ {2,}/g, ' ')
    .trim();
}
function vcardText(s){ return vcardUnescape(vcardClean(s)); }

/* ---------- vCard 2.1 Quoted-Printable 해독 (=ED=99=A9 → 홍) ---------- */
const QP_RUN = /(?:=[0-9A-Fa-f]{2}){2,}/;
function looksQuotedPrintable(s){ return QP_RUN.test(String(s == null ? '' : s)); }
function pushUtf8Bytes(bytes, cp){
  if (cp < 0x80) bytes.push(cp);
  else if (cp < 0x800) bytes.push(0xC0 | (cp >> 6), 0x80 | (cp & 0x3F));
  else if (cp < 0x10000) bytes.push(0xE0 | (cp >> 12), 0x80 | ((cp >> 6) & 0x3F), 0x80 | (cp & 0x3F));
  else bytes.push(0xF0 | (cp >> 18), 0x80 | ((cp >> 12) & 0x3F), 0x80 | ((cp >> 6) & 0x3F), 0x80 | (cp & 0x3F));
}
function bytesToText(bytes, charset){
  const cs = String(charset || '').toLowerCase();
  const euc = /euc[-_]?kr|ks[-_]?c[-_]?5601|cp949|windows[-_]?949|uhc/.test(cs);
  const order = euc ? ['euc-kr', 'windows-949', 'utf-8'] : ['utf-8', 'euc-kr'];
  if (typeof TextDecoder !== 'undefined'){
    for (const enc of order){
      try { return new TextDecoder(enc, { fatal: true }).decode(bytes); } catch(e){}
    }
    for (const enc of order){
      try { return new TextDecoder(enc).decode(bytes); } catch(e){}
    }
  }
  return euc ? eucKrDecode(bytes) : utf8Decode(bytes);
}
